spring.application.name=revconnect
# ===============================
# = SERVER CONFIG
# ===============================

server.port=8080
server.servlet.context-path=/api


# ===============================
# = ORACLE DATABASE CONFIG
# ===============================

# IMPORTANT: Use Service Name (XEPDB1), NOT XE

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1

spring.datasource.username=revconnect
spring.datasource.password=revconnect123

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


# ===============================
# JPA / HIBERNATE CONFIG
# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.use_sql_comments=true

# Force Oracle dialect

#spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Disable temp mutation strategy

#spring.jpa.properties.hibernate.query.mutation_strategy=inline
#spring.jpa.properties.hibernate.query.insert_strategy=inline

# ===============================
# = CONNECTION POOL (Hikari)
# ===============================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000


# ===============================
# = LOGGING
# ===============================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


# ===============================
# = JACKSON CONFIG
# ===============================

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false


# ===============================
# = FILE UPLOAD CONFIG
# ===============================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ===============================
# = TIMEZONE
# ===============================

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# FIX DUPLICATE TABLE ISSUE

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl



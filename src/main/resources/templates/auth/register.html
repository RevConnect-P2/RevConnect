<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Account | RevConnect</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>
<div class="top-nav">

    <div class="top-nav">

        <div class="logo-area">
            <div class="logo-dot"></div>
            RevConnect
        </div>

<!--        <div>-->
<!--            <button class="btn-login">Login</button>-->
<!--            <button class="btn-sign">Sign Up</button>-->
<!--        </div>-->

    </div>

<div class="auth-container">

    <!-- LEFT SIDE -->
    <div class="left-panel">

        <h1 class="brand-title">RevConnect</h1>

        <p class="brand-subtitle">
            Let's Connect
        </p>

        <p class="brand-desc">
            Connect with friends, collaborate with creators and grow your network.
        </p>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right-panel">

        <div class="form-card">

            <div class="logo">Create Account</div>
            <div class="subtitle">Create your professional account</div>

            <div th:if="${error}" class="alert alert-danger text-center mt-2">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/register}" method="post">

                <label>Email</label>
                <input type="email" class="form-control" name="email" placeholder="Enter email" required>

                <label>Username</label>
                <input type="text" class="form-control" name="username" placeholder="Enter username" required>

                <label>Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" name="password" id="password" placeholder="Enter password" required>
                    <span class="input-group-text" onclick="togglePassword()">
                        <i class="fa fa-eye"></i>
                    </span>
                </div>

                <label>User Type</label>

                <div class="user-type">

                    <label>
                        <input type="radio" name="userType" value="USER" required>
                        Personal
                    </label>

                    <label>
                        <input type="radio" name="userType" value="CREATOR">
                        Creator
                    </label>

                    <label>
                        <input type="radio" name="userType" value="BUSINESS">
                        Business
                    </label>

                </div>

                <label>Security Question</label>
                <select class="form-select" name="securityQuestion" required>
                    <option value="">Select Question</option>
                    <option>What is your pet name?</option>
                    <option>What is your school name?</option>
                    <option>What is your favorite color?</option>
                    <option>What is your best friend name?</option>
                </select>

                <label>Security Answer</label>
                <input type="text" class="form-control" name="securityAnswer" placeholder="Enter answer" required>

                <button class="btn btn-primary w-100 mt-3">
                    Create Account
                </button>

            </form>

            <div class="bottom-text mt-3">
                Already have account?
                <a th:href="@{/login}">Login</a>
            </div>

        </div>

    </div>

</div>

<script>
    function togglePassword(){
        var x=document.getElementById("password");
        x.type=x.type==="password"?"text":"password";
    }
</script>

</body>
</html>

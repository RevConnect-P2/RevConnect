<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Reset Password | RevConnect</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/reset.css">

</head>

<body>

<div class="main-container">

    <!-- LEFT SIDE -->

    <div class="left-section">

        <div class="top-logo">
            <span class="dot"></span>
            RevConnect
        </div>

        <h1 class="brand-title">Secure Account</h1>

        <p class="tagline">Reset your password</p>

        <p class="desc">
            Verify your security question and create a new password to regain access to your RevConnect account.
        </p>

        <!-- floating icons -->

        <i class="fa-solid fa-lock float-icon lock"></i>
        <i class="fa-solid fa-key float-icon key"></i>
        <i class="fa-solid fa-user-shield float-icon shield"></i>
        <i class="fa-solid fa-user-check float-icon verify"></i>

    </div>


    <!-- RIGHT SIDE -->

    <div class="right-section">

        <div class="reset-card">

            <div class="icon-area">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <h3>Reset Password</h3>

            <p class="subtitle">
                Answer your security question
            </p>

            <div th:if="${error}" class="alert alert-danger text-center">
                <span th:text="${error}"></span>
            </div>

            <div th:if="${success}" class="alert alert-success text-center">
                <span th:text="${success}"></span>
            </div>

            <!-- SECURITY QUESTION -->

            <label>Security Question</label>

            <input type="text"
                   class="form-control"
                   th:value="${question}"
                   readonly>

            <form th:action="@{/reset-password}" method="post">

                <input type="hidden" name="email" th:value="${email}">

                <label>Your Answer</label>

                <input type="text"
                       name="answer"
                       class="form-control"
                       placeholder="Enter your answer"
                       required>

                <label>New Password</label>

                <div class="input-group">

                    <input type="password"
                           name="newPassword"
                           id="newPassword"
                           class="form-control"
                           placeholder="Enter new password"
                           required>

                    <span class="input-group-text eye-btn"
                          onclick="togglePassword()">

                        <i class="fa fa-eye"></i>

</span>

                </div>

                <button class="btn reset-btn w-100">
                    Reset Password
                </button>

            </form>

            <hr>

            <div class="text-center back-login">

                <a th:href="@{/login}">
                    <i class="fa fa-arrow-left"></i>
                    Back to Login
                </a>

            </div>

        </div>

    </div>

</div>

<script>

    function togglePassword(){

    var field=document.getElementById("newPassword");

    if(field.type==="password"){
    field.type="text";
    }else{
    field.type="password";
    }

    }

</script>

</body>
</html>

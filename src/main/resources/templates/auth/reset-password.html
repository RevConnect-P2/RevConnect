<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <title>Reset Password | RevConnect</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">


  <style>

    body{
    background:#f3f6f8;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:system-ui;
    }

    .reset-card{
    width:430px;
    border:none;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    }

    .card-header{
    background:white;
    border-bottom:none;
    text-align:center;
    padding-top:25px;
    }

    .lock-icon{
    font-size:40px;
    color:#198754;
    }

    .title{
    font-weight:600;
    margin-top:10px;
    }

    .form-control{
    border-radius:8px;
    padding:10px;
    }

    .btn-reset{
    background:#198754;
    border:none;
    border-radius:25px;
    font-weight:600;
    padding:10px;
    transition:0.3s;
    }

    .btn-reset:hover{
    background:#146c43;
    }

    .eye-btn{
    cursor:pointer;
    }

    .back-link{
    color:#0a66c2;
    text-decoration:none;
    font-weight:500;
    }

    .back-link:hover{
    text-decoration:underline;
    }

  </style>

</head>


<body>



<div class="card reset-card">



  <div class="card-header">

    <i class="bi bi-shield-lock lock-icon"></i>

    <h3 class="title">Reset Password</h3>

  </div>



  <div class="card-body">


    <!-- ERROR -->

    <div th:if="${error}" class="alert alert-danger text-center">

      <span th:text="${error}"></span>

    </div>



    <!-- SUCCESS -->

    <div th:if="${success}" class="alert alert-success text-center">

      <span th:text="${success}"></span>

    </div>



    <!-- SECURITY QUESTION -->

    <div class="mb-3">

      <label class="fw-semibold">Security Question</label>

      <input type="text"
             class="form-control"
             th:value="${question}"
             readonly>

    </div>



    <form th:action="@{/reset-password}" method="post">


      <input type="hidden"
             name="email"
             th:value="${email}">



      <!-- ANSWER -->

      <div class="mb-3">

        <label class="fw-semibold">Your Answer</label>

        <input type="text"
               name="answer"
               class="form-control"
               required>

      </div>



      <!-- PASSWORD -->

      <div class="mb-3">

        <label class="fw-semibold">New Password</label>

        <div class="input-group">

          <input type="password"
                 name="newPassword"
                 id="newPassword"
                 class="form-control"
                 required>

          <span class="input-group-text eye-btn"
                onclick="togglePassword()">

<i class="bi bi-eye"></i>

</span>

        </div>

      </div>



      <button class="btn btn-reset w-100">

        Reset Password

      </button>


    </form>



    <hr>



    <div class="text-center">

      <a th:href="@{/login}" class="back-link">

        <i class="bi bi-arrow-left"></i>

        Back to Login

      </a>

    </div>



  </div>

</div>



<script>

  function togglePassword(){

  var field = document.getElementById("newPassword");

  if(field.type === "password"){

  field.type="text";

  }else{

  field.type="password";

  }

  }

</script>



</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Login | RevConnect</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/login.css">

</head>

<body>

<div class="main-container">

    <!-- LEFT SIDE -->

    <div class="left-section">

        <div class="top-logo">
            <span class="dot"></span>
            RevConnect
        </div>

        <h1 class="brand-title">
            RevConnect
        </h1>

        <p class="tagline">
            Let's Connect
        </p>

        <p class="desc">
            Connect with friends, collaborate with creators and grow your network.
        </p>

        <!-- floating icons -->

        <i class="fa-solid fa-heart float-icon heart"></i>
        <i class="fa-solid fa-comment float-icon comment"></i>
        <i class="fa-solid fa-share-nodes float-icon share"></i>
        <i class="fa-solid fa-thumbs-up float-icon like"></i>
        <i class="fa-solid fa-user-plus float-icon follow"></i>
        <i class="fa-solid fa-network-wired float-icon network"></i>
        <i class="fa-solid fa-paper-plane float-icon message"></i>
        <i class="fa-solid fa-users float-icon community"></i>
        <i class="fa-solid fa-user-plus float-icon connect"></i>
        <i class="fa-solid fa-share-nodes float-icon share"></i>
        <i class="fa-solid fa-users float-icon community"></i>
        <i class="fa-solid fa-comment-dots float-icon message"></i>
        <i class="fa-solid fa-heart float-icon love"></i>
        <i class="fa-solid fa-thumbs-up float-icon like"></i>
<!--        <i class="fa-solid fa-paper-plane float-icon send"></i>-->
        <i class="fa-solid fa-hashtag float-icon hashtag"></i>
<!--        <i class="fa-solid fa-user-check float-icon follow"></i>-->

    </div>


    <!-- RIGHT SIDE LOGIN CARD -->

    <div class="right-section">

        <div class="login-card">

            <h3 class="login-title">RevConnect</h3>

            <p class="login-subtitle">Sign in to continue</p>

            <div th:if="${success}" class="alert alert-success text-center">
                <span th:text="${success}"></span>
            </div>

            <div th:if="${error}" class="alert alert-danger text-center">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">

                    <label>Email</label>

                    <div class="input-group">

<span class="input-group-text">
<i class="fa fa-envelope"></i>
</span>

                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="Enter email"
                               required>

                    </div>

                </div>


                <div class="mb-3">

                    <label>Password</label>

                    <div class="input-group">

<span class="input-group-text">
<i class="fa fa-lock"></i>
</span>

                        <input type="password"
                               name="password"
                               id="password"
                               class="form-control"
                               placeholder="Enter password"
                               required>

                        <span class="input-group-text eye" onclick="togglePassword()">
<i id="eyeIcon" class="fa fa-eye"></i>
</span>

                    </div>

                    <div class="text-end mt-2">

                        <a th:href="@{/forgot-password}" class="forgot">
                            Forgot Password?
                        </a>

                    </div>

                </div>

                <button class="btn login-btn w-100">
                    Login
                </button>

            </form>

            <hr>

            <div class="text-center">

<span class="text-muted">
Don't have an account?
</span>

                <a th:href="@{/register}" class="register-link">
                    Create Account
                </a>

            </div>

        </div>

    </div>

</div>


<script>

    function togglePassword(){

    var password=document.getElementById("password");
    var icon=document.getElementById("eyeIcon");

    if(password.type==="password"){
    password.type="text";
    icon.classList.remove("fa-eye");
    icon.classList.add("fa-eye-slash");
    }else{
    password.type="password";
    icon.classList.remove("fa-eye-slash");
    icon.classList.add("fa-eye");
    }

    }

</script>

</body>
</html>

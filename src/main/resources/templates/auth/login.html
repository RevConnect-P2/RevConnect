<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Login | RevConnect</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>

        body{
        height:100vh;
        background: linear-gradient(135deg,#0a66c2,#00a0dc);
        display:flex;
        justify-content:center;
        align-items:center;
        font-family:'Segoe UI',sans-serif;
        margin:0;
        }

        .card{
        width:400px;
        border-radius:18px;
        padding:35px;
        background:white;
        box-shadow:0 15px 35px rgba(0,0,0,0.2);
        transition:0.3s;
        }

        .card:hover{
        transform:translateY(-3px);
        }

        .logo{
        font-size:34px;
        font-weight:700;
        color:#0a66c2;
        text-align:center;
        letter-spacing:1px;
        }

        .subtitle{
        text-align:center;
        color:gray;
        margin-bottom:25px;
        }

        .form-control{
        border-radius:10px;
        padding:12px;
        border:1px solid #dcdcdc;
        }

        .form-control:focus{
        box-shadow:0 0 5px rgba(10,102,194,0.5);
        border-color:#0a66c2;
        }

        .btn-primary{
        border-radius:10px;
        padding:12px;
        font-weight:600;
        background:#0a66c2;
        border:none;
        transition:0.3s;
        }

        .btn-primary:hover{
        background:#084c9e;
        }

        .eye{
        cursor:pointer;
        }

        a{
        text-decoration:none;
        font-weight:500;
        }

        a:hover{
        text-decoration:underline;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="logo">
        RevConnect
    </div>

    <div class="subtitle">
        Sign in to continue
    </div>

    <div th:if="${success}" class="alert alert-success text-center">
        <span th:text="${success}"></span>
    </div>

    <div th:if="${error}" class="alert alert-danger text-center">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/login}" method="post">

        <!-- Email -->

        <div class="mb-3">

            <label>Email</label>

            <div class="input-group">

<span class="input-group-text">
<i class="fa fa-envelope"></i>
</span>

                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter your email"
                       required>

            </div>

        </div>

        <!-- Password -->

        <div class="mb-3">

            <label>Password</label>

            <div class="input-group">

<span class="input-group-text">
<i class="fa fa-lock"></i>
</span>

                <input type="password"
                       name="password"
                       id="password"
                       class="form-control"
                       placeholder="Enter password"
                       required>

                <span class="input-group-text eye" onclick="togglePassword()">
<i id="eyeIcon" class="fa fa-eye"></i>
</span>

            </div>

            <!-- Forgot Password -->

            <div class="text-end mt-2">

                <a th:href="@{/forgot-password}" class="text-danger small">
                    Forgot Password?
                </a>

            </div>

        </div>

        <button class="btn btn-primary w-100 mt-2">
            Login
        </button>

    </form>

    <hr>

    <div class="text-center">

<span class="text-muted">
Don't have an account?
</span>

        <a th:href="@{/register}" class="fw-bold">
            Register
        </a>

    </div>

</div>

<script>

    function togglePassword(){

    var password=document.getElementById("password");
    var icon=document.getElementById("eyeIcon");

    if(password.type==="password"){

    password.type="text";
    icon.classList.remove("fa-eye");
    icon.classList.add("fa-eye-slash");

    }else{

    password.type="password";
    icon.classList.remove("fa-eye-slash");
    icon.classList.add("fa-eye");

    }

    }

</script>

</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Forgot Password | RevConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">


    <style>

        body{

        background:#f3f6f8;

        height:100vh;

        display:flex;

        align-items:center;

        justify-content:center;

        font-family:system-ui;

        }


        .forgot-card{

        width:420px;

        border:none;

        border-radius:12px;

        box-shadow:0 4px 15px rgba(0,0,0,0.1);

        }



        .card-header{

        background:white;

        border-bottom:none;

        padding-top:25px;

        }



        .lock-icon{

        font-size:40px;

        color:#0a66c2;

        }



        .title{

        font-weight:600;

        margin-top:10px;

        }



        .form-control{

        border-radius:8px;

        padding:10px;

        }



        .btn-reset{

        background:#0a66c2;

        border:none;

        border-radius:25px;

        font-weight:600;

        padding:10px;

        transition:0.3s;

        }



        .btn-reset:hover{

        background:#004182;

        }



        .back-link{

        color:#0a66c2;

        text-decoration:none;

        font-weight:500;

        }



        .back-link:hover{

        text-decoration:underline;

        }


    </style>


</head>


<body>



<div class="card forgot-card">



    <div class="card-header text-center">

        <i class="bi bi-shield-lock lock-icon"></i>

        <h3 class="title">Forgot Password</h3>

    </div>



    <div class="card-body">



        <!-- ERROR MESSAGE -->

        <div th:if="${error}" class="alert alert-danger text-center">

            <span th:text="${error}"></span>

        </div>



        <!-- SUCCESS MESSAGE -->

        <div th:if="${message}" class="alert alert-info text-center">

            <span th:text="${message}"></span>

        </div>



        <form th:action="@{/forgot-password}" method="post">



            <div class="mb-3">

                <label class="form-label fw-semibold">

                    Email Address

                </label>


                <input type="email"

                       class="form-control"

                       name="email"

                       placeholder="Enter your registered email"

                       required>

            </div>



            <button class="btn btn-reset w-100">

                Get Security Question

            </button>



        </form>



        <hr>



        <div class="text-center">

            <a th:href="@{/login}" class="back-link">

                <i class="bi bi-arrow-left"></i>

                Back to Login

            </a>

        </div>



    </div>

</div>



</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Forgot Password | RevConnect</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/forgot.css">

</head>

<body>

<div class="main-container">

    <!-- LEFT SIDE -->

    <div class="left-section">

        <div class="top-logo">
            <span class="dot"></span>
            RevConnect
        </div>

        <h1 class="brand-title">Recover Access</h1>

        <p class="tagline">
            Forgot your password?
        </p>

        <p class="desc">
            Enter your registered email and answer your security question to regain access.
        </p>

        <!-- floating icons -->

        <i class="fa-solid fa-lock float-icon lock"></i>
        <i class="fa-solid fa-key float-icon key"></i>
        <i class="fa-solid fa-user-shield float-icon shield"></i>

    </div>


    <!-- RIGHT CARD -->

    <div class="right-section">

        <div class="forgot-card">

            <div class="icon-area">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <h3>Forgot Password</h3>

            <p class="subtitle">
                Recover your RevConnect account
            </p>

            <div th:if="${error}" class="alert alert-danger text-center">
                <span th:text="${error}"></span>
            </div>

            <div th:if="${message}" class="alert alert-info text-center">
                <span th:text="${message}"></span>
            </div>

            <form th:action="@{/forgot-password}" method="post">

                <label>Email Address</label>

                <input type="email"
                       class="form-control"
                       name="email"
                       placeholder="Enter your registered email"
                       required>

                <button class="btn reset-btn w-100">
                    Get Security Question
                </button>

            </form>

            <hr>

            <div class="text-center back-login">

                <a th:href="@{/login}">
                    <i class="fa fa-arrow-left"></i>
                    Back to Login
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>

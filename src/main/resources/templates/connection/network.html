<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>My Network</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <h3>My Network</h3>
    <hr>


    <!-- ========================= -->
    <!-- PENDING REQUESTS -->
    <!-- ========================= -->

    <h5>Pending Requests</h5>

    <div th:if="${#lists.isEmpty(pendingRequests)}">

        <p class="text-muted">
            No pending requests.
        </p>

    </div>

    <div th:each="conn : ${pendingRequests}" class="card p-3 mb-2">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <a th:href="@{/profile/{username}(username=${conn.sender.username})}">
                    <span th:text="${conn.sender.username}"></span>
                </a>

                <div>
                    <small class="text-muted">Pending request</small>
                </div>

            </div>

            <div>

                <button class="btn btn-success btn-sm"
                        th:onclick="'acceptConnection(' + ${conn.connectionId} + ')'">
                    Accept
                </button>

                <button class="btn btn-danger btn-sm"
                        th:onclick="'rejectConnection(' + ${conn.connectionId} + ')'">
                    Reject
                </button>

            </div>

        </div>

    </div>

    <hr>


    <!-- ========================= -->
    <!-- ACCEPTED CONNECTIONS -->
    <!-- ========================= -->

    <h5>My Connections</h5>

    <div th:if="${#lists.isEmpty(connections)}">

        <p class="text-muted">
            You have no connections yet.
        </p>

    </div>

    <div th:each="conn : ${connections}" class="card p-3 mb-2">

        <div>

            <!-- IF CURRENT USER IS SENDER -->
            <a th:if="${conn.sender.userId == session.loggedUser.userId}"
               th:href="@{/profile/{username}(username=${conn.receiver.username})}">

                <span th:text="${conn.receiver.username}"></span>

            </a>

            <!-- IF CURRENT USER IS RECEIVER -->
            <a th:if="${conn.receiver.userId == session.loggedUser.userId}"
               th:href="@{/profile/{username}(username=${conn.sender.username})}">

                <span th:text="${conn.sender.username}"></span>

            </a>

        </div>

    </div>

</div>


<script>

    function acceptConnection(connectionId){

    fetch('/connections/accept/' + connectionId,{
    method:'POST'
    })
    .then(()=>{
    alert("Connection accepted");
    location.reload();
    });

    }

    function rejectConnection(connectionId){

    fetch('/connections/reject/' + connectionId,{
    method:'POST'
    })
    .then(()=>{
    alert("Connection rejected");
    location.reload();
    });

    }

</script>

</body>
</html>

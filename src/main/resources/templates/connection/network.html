<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>


    <title>My Network</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- BOOTSTRAP ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- YOUR THEME CSS -->
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">


</head>

<body>

<!-- NAVBAR -->

<!--<div th:replace="~{layout/navbar :: navbar(${session.loggedUser})}"></div>-->
<div th:replace="~{layout/navbar :: navbar(${session.loggedUser}, 'network')}"></div>
<div class="container mt-4 network-page">


    <div class="row justify-content-center">

        <div class="col-md-6">

            <h4 class="mb-4 fw-bold text-white">My Network</h4>


            <!-- ========================= -->
            <!-- PENDING REQUESTS -->
            <!-- ========================= -->

            <div class="card feed-card mb-4">

                <div class="card-body">

                    <h6 class="network-section-title">Pending Requests</h6>

                    <div th:if="${#lists.isEmpty(pendingRequests)}"
                         class="text-muted">
                        No pending requests.
                    </div>


                    <div th:each="conn : ${pendingRequests}"
                         class="d-flex justify-content-between align-items-center mb-3">

                        <div>

                            <a th:href="@{/profile/{username}(username=${conn.sender.username})}"
                               class="text-decoration-none">

                                <span th:text="${conn.sender.username}"></span>

                            </a>

                            <div>
                                <small class="text-muted">Pending request</small>
                            </div>

                        </div>

                        <div>

                            <!-- ACCEPT -->
                            <form th:action="@{/connections/accept/{id}(id=${conn.connectionId})}"
                                  method="post"
                                  style="display:inline;">

                                <button type="submit"
                                        class="btn btn-success btn-sm">
                                    Accept
                                </button>

                            </form>

                            <!-- REJECT -->
                            <form th:action="@{/connections/reject/{id}(id=${conn.connectionId})}"
                                  method="post"
                                  style="display:inline;">

                                <button type="submit"
                                        class="btn btn-danger btn-sm">
                                    Reject
                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>


            <!-- ========================= -->
            <!-- MY CONNECTIONS -->
            <!-- ========================= -->

            <div class="card feed-card">

                <div class="card-body">

                    <h6 class="network-section-title">My Connections</h6>

                    <div th:if="${#lists.isEmpty(connections)}"
                         class="text-muted">
                        You have no connections yet.
                    </div>


                    <div th:each="conn : ${connections}"
                         class="d-flex justify-content-between align-items-center mb-3">

                        <div>

                            <!-- IF CURRENT USER IS SENDER -->
                            <a th:if="${conn.sender.userId == session.loggedUser.userId}"
                               th:href="@{/profile/{username}(username=${conn.receiver.username})}"
                               class="text-decoration-none">

                                <span th:text="${conn.receiver.username}"></span>

                            </a>

                            <!-- IF CURRENT USER IS RECEIVER -->
                            <a th:if="${conn.receiver.userId == session.loggedUser.userId}"
                               th:href="@{/profile/{username}(username=${conn.sender.username})}"
                               class="text-decoration-none">

                                <span th:text="${conn.sender.username}"></span>

                            </a>

                        </div>


                        <div>

                            <button class="btn btn-success btn-sm" disabled>
                                Connected
                            </button>

                            <form th:action="@{/connections/remove/{id}(id=${conn.connectionId})}"
                                  method="post"
                                  style="display:inline;">

                                <button type="submit"
                                        class="btn btn-danger btn-sm">
                                    Remove
                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>


        </div>

    </div>


</div>

</body>
</html>

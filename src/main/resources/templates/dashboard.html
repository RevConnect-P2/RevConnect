<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>RevConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #fafafa;
        }
        .sidebar {
            height: 100vh;
            border-right: 1px solid #ddd;
        }
        .sidebar a {
            text-decoration: none;
            color: #000;
            font-weight: 500;
        }
        .sidebar a:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- ========================= -->
        <!-- LEFT SIDEBAR -->
        <!-- ========================= -->
        <div class="col-2 sidebar p-3">

            <h5 class="mb-4 fw-bold">RevConnect</h5>

            <div class="d-grid gap-2">
                <a th:href="@{/dashboard}" class="btn btn-light text-start">🏠 Feed</a>
                <a th:href="@{/posts/create}" class="btn btn-light text-start">➕ Create Post</a>
                <a th:href="@{/posts/my}" class="btn btn-light text-start">📌 My Posts</a>
                <a th:href="@{/logout}" class="btn btn-light text-start text-danger">🚪 Logout</a>
            </div>

        </div>

        <!-- ========================= -->
        <!-- MAIN FEED AREA -->
        <!-- ========================= -->
        <div class="col-7 p-4">

            <!-- Feed -->
            <th:block th:replace="posts/post-feed :: postFeed"></th:block>

        </div>

        <!-- ========================= -->
        <!-- RIGHT SIDE (FUTURE USE) -->
        <!-- ========================= -->
        <div class="col-3 p-4 text-muted small">
            Suggestions / Profile (future)
        </div>

    </div>
</div>

<script th:src="@{/js/posts.js}"></script>
</body>
</html>

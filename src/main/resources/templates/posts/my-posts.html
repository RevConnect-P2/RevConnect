<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Posts | RevConnect</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">

</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{layout/navbar :: navbar(${user})}"></div>

<div class="container mt-4">
    <div class="row">

        <!-- LEFT SIDEBAR -->
        <div class="col-md-3 left-sidebar">
            <div th:replace="layout/left-sidebar :: leftSidebar(${user},${connectionsCount},${followersCount},${followingCount})"></div>
        </div>

        <!-- CENTER CONTENT -->
        <div class="col-md-6">

            <h5 class="mb-3 fw-bold">My Posts</h5>

            <div id="myPostsContainer"></div>

        </div>

        <!-- RIGHT SIDEBAR -->
        <div class="col-md-3 right-sidebar">
            <div th:replace="layout/right-sidebar :: rightSidebar"></div>
        </div>

    </div>
</div>

<script th:inline="javascript">
    window.CURRENT_USER_ID = [[${user.userId}]];
</script>

<script src="/js/posts.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", fetchMyPostsPage);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

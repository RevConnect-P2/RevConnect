<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Post</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- ========================= -->
<!-- NAVBAR -->
<!-- ========================= -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">Create Post</span>

        <div>
            <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm me-2">Feed</a>
            <a th:href="@{/posts/my}" class="btn btn-outline-light btn-sm">My Posts</a>
        </div>
    </div>
</nav>

<!-- ========================= -->
<!-- CREATE POST FORM -->
<!-- ========================= -->
<div class="container mt-5">

    <div class="card shadow-sm">
        <div class="card-body">

            <h5 class="fw-bold mb-3">Share something</h5>

            <!-- Content -->
            <textarea id="postContent"
                      class="form-control mb-3"
                      rows="4"
                      placeholder="What's on your mind?"></textarea>

            <!-- Post Type -->
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="small text-muted">Post Type</label>
                    <select id="postType" class="form-select form-select-sm">
                        <option value="NORMAL">Normal</option>
                        <option value="PROMOTIONAL">Promotional</option>
                    </select>
                </div>
            </div>

            <!-- Hashtags -->
            <input type="text"
                   id="hashtags"
                   class="form-control form-control-sm mb-3"
                   placeholder="#java #springboot">

            <!-- CTA (only for promotional) -->
            <div id="ctaSection" class="row g-2 mb-3 d-none">
                <div class="col-md-6">
                    <input id="ctaText"
                           type="text"
                           class="form-control form-control-sm"
                           placeholder="CTA Text (e.g. Learn More)">
                </div>
                <div class="col-md-6">
                    <input id="ctaLink"
                           type="text"
                           class="form-control form-control-sm"
                           placeholder="CTA Link (https://...)">
                </div>
            </div>

            <!-- Schedule -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="small text-muted">Schedule (optional)</label>
                    <input type="datetime-local"
                           id="scheduledAt"
                           class="form-control form-control-sm">
                </div>
            </div>

            <!-- Submit -->
            <div class="text-end">
                <button class="btn btn-primary btn-sm" onclick="createPost()">
                    Post
                </button>
            </div>

        </div>
    </div>

</div>

<script th:src="@{/js/posts.js}"></script>

<script>
    // Toggle CTA section
    document.getElementById("postType").addEventListener("change", function () {
        const ctaSection = document.getElementById("ctaSection");
        if (this.value === "PROMOTIONAL") {
            ctaSection.classList.remove("d-none");
        } else {
            ctaSection.classList.add("d-none");
        }
    });
</script>

</body>
</html>

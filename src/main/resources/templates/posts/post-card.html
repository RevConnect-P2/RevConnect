<!-- Post Card Fragment -->
<div th:fragment="postCard" class="card shadow-sm mb-3" xmlns:th="http://www.w3.org/1999/xhtml">
<div th:fragment="postCard(post)" class="card shadow-sm mb-3">

    <div class="card-body">

        <!-- ========================= -->
        <!-- POST HEADER -->
        <!-- ========================= -->
        <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
                <strong class="text-dark"
                        th:text="${post.username}">
                    Username
                </strong>
            </div>

            <small class="text-muted"
                   th:text="${#temporals.format(post.createdAt,'dd MMM yyyy hh:mm a')}">
            </small>
        </div>

        <!-- ========================= -->
        <!-- POST CONTENT -->
        <!-- ========================= -->
        <p class="mb-2"
           th:text="${post.content}">
        </p>

        <!-- ========================= -->
        <!-- HASHTAGS -->
        <!-- ========================= -->
        <div class="mb-2"
             th:if="${post.hashtags != null}">
            <span th:each="tag : ${post.hashtags}"
                  class="badge bg-light text-primary me-1"
                  th:text="'#' + ${tag}">
            </span>
        </div>

        <!-- ========================= -->
        <!-- TAGGED PRODUCT / SERVICE -->
        <!-- ========================= -->
        <div th:if="${post.tags != null and !post.tags.isEmpty()}"
             class="mb-2">

            <span th:each="tag : ${post.tags}"
                  class="badge bg-success me-1"
                  th:text="${tag.tagType} + ': ' + ${tag.tagName}">
            </span>

        </div>

        <!-- ========================= -->
        <!-- PROMOTIONAL CTA BUTTON -->
        <!-- ========================= -->
        <div th:if="${post.postType == 'PROMOTIONAL'}"
             class="mb-2">

            <a th:if="${post.ctaLink != null}"
               th:href="${post.ctaLink}"
               target="_blank"
               class="btn btn-primary btn-sm">

                <span th:text="${post.ctaText}">Claim Offer</span>

            </a>

        </div>

        <hr>

        <!-- ========================= -->
        <!-- POST ACTIONS -->
        <!-- ========================= -->
        <div class="d-flex justify-content-around text-muted">

            <div class="post-action">
                👍 Like
            </div>

            <div class="post-action">
                💬 Comment
            </div>

            <div class="post-action">
                🔗 Share
            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- LIKE COMMENT SHARE SECTION -->
    <!-- ========================= -->
    <div class="border-top pt-3 mt-3">

        <div class="d-flex justify-content-between mb-2 small text-muted">
        <span>
            <i class="bi bi-hand-thumbs-up"></i>
            <span th:text="${post.likeCount}">0</span>
        </span>

            <span>
            <i class="bi bi-chat-dots"></i>
            <span th:text="${post.commentCount}">0</span> Comments
        </span>

            <span>
            <i class="bi bi-arrow-repeat"></i>
            <span th:text="${post.shareCount}">0</span> Shares
        </span>
        </div>

        <div class="d-flex justify-content-around">

            <!-- LIKE -->
            <form th:action="@{/posts/{id}/like(id=${post.postId})}"
                  method="post">
                <button type="submit"
                        class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-hand-thumbs-up"></i> Like
                </button>
            </form>

            <!-- COMMENT -->
            <form th:action="@{/posts/{id}/comments(id=${post.postId})}"
                  method="post"
                  class="d-flex gap-2">

                <input type="text"
                       name="commentText"
                       class="form-control form-control-sm"
                       placeholder="Write comment..."
                       required>

                <button type="submit"
                        class="btn btn-sm btn-outline-secondary">
                    Comment
                </button>
            </form>

            <!-- SHARE -->
            <form th:action="@{/posts/{id}/share(id=${post.postId})}"
                  method="post">
                <button type="submit"
                        class="btn btn-sm btn-outline-success">
                    <i class="bi bi-arrow-repeat"></i> Share
                </button>
            </form>

        </div>

    </div>

</div>

<div th:fragment="postCard(post)"
     class="card post-card mb-3">

    <div class="card-body">

        <!-- HEADER -->
        <div class="d-flex justify-content-between mb-2">

            <strong th:text="${post.username}">
                Username
            </strong>

            <small class="text-muted"
                   th:text="${#temporals.format(post.createdAt,'dd MMM yyyy hh:mm a')}">
            </small>

        </div>

        <!-- CONTENT -->
        <p th:text="${post.content}">
        </p>

        <!-- HASHTAGS -->
        <div th:if="${post.hashtags != null}" class="mb-2">

        <span th:each="tag : ${post.hashtags}"
              class="badge bg-light text-primary me-1"
              th:text="'#' + ${tag}">
        </span>

        </div>

        <!-- TAGGED PRODUCTS -->
        <div th:if="${post.tags != null and !post.tags.isEmpty()}"
             class="mb-2">

        <span th:each="tag : ${post.tags}"
              class="badge bg-success me-1"
              th:text="${tag.tagType} + ': ' + ${tag.tagName}">
        </span>

        </div>

        <!-- PROMOTIONAL CTA -->
        <div th:if="${post.postType == 'PROMOTIONAL'}"
             class="mb-2">

            <a th:href="${post.ctaLink}"
               target="_blank"
               class="btn btn-primary btn-sm">

            <span th:text="${post.ctaText}">
                Claim Offer
            </span>

            </a>

        </div>

        <hr>

        <!-- ACTIONS -->
        <div class="d-flex justify-content-around text-muted">

            <div class="post-action">
                👍 Like
            </div>

            <div class="post-action">
                💬 Comment
            </div>

            <div class="post-action">
                🔗 Share
            </div>

        </div>

    </div>

    <!-- STATS + ACTION BUTTONS -->
    <div class="border-top pt-3 mt-3">

        <div class="d-flex justify-content-between mb-2 small text-muted">

        <span>
            👍 <span th:text="${post.likeCount}">0</span>
        </span>

            <span>
            💬 <span th:text="${post.commentCount}">0</span> Comments
        </span>

            <span>
            🔄 <span th:text="${post.shareCount}">0</span> Shares
        </span>

        </div>

        <div class="d-flex justify-content-around">

            <!-- LIKE -->
            <form th:action="@{/posts/{id}/like(id=${post.postId})}"
                  method="post">

                <button class="btn btn-sm btn-outline-primary">
                    👍 Like
                </button>

            </form>

            <!-- COMMENT -->
            <form th:action="@{/posts/{id}/comments(id=${post.postId})}"
                  method="post"
                  class="d-flex gap-2">

                <input type="text"
                       name="commentText"
                       class="form-control form-control-sm"
                       placeholder="Write comment..."
                       required>

                <button class="btn btn-sm btn-outline-secondary">
                    Comment
                </button>

            </form>

            <!-- SHARE -->
            <form th:action="@{/posts/{id}/share(id=${post.postId})}"
                  method="post">

                <button class="btn btn-sm btn-outline-success">
                    🔗 Share
                </button>

            </form>

        </div>

    </div>

</div>

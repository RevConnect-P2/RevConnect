<!-- Post Card Fragment -->
<div th:fragment="postCard" class="card shadow-sm mb-3" xmlns:th="http://www.w3.org/1999/xhtml">

    <div class="card-body">

        <!-- ========================= -->
        <!-- POST HEADER -->
        <!-- ========================= -->
        <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
                <strong class="text-dark post-username">username</strong>
            </div>
            <small class="text-muted post-time">just now</small>
        </div>

        <!-- ========================= -->
        <!-- POST CONTENT -->
        <!-- ========================= -->
        <p class="mb-2 post-content">
            This is a sample post content. Real content will be injected by JavaScript.
        </p>

        <!-- ========================= -->
        <!-- HASHTAGS -->
        <!-- ========================= -->
        <div class="mb-2 post-hashtags">
            <span class="badge bg-light text-primary">#java</span>
            <span class="badge bg-light text-primary">#springboot</span>
        </div>

        <!-- ========================= -->
        <!-- POST ACTIONS (FUTURE) -->
        <!-- ========================= -->
        <div class="d-flex justify-content-end">
            <button class="btn btn-sm btn-outline-danger d-none post-delete-btn">
                Delete
            </button>
        </div>

    </div>

    <!-- ========================= -->
    <!-- LIKE COMMENT SHARE SECTION -->
    <!-- ========================= -->
    <div class="border-top pt-3 mt-3">

        <div class="d-flex justify-content-between mb-2 small text-muted">
        <span>
            <i class="bi bi-hand-thumbs-up"></i>
            <span th:text="${post.likeCount}">0</span>
        </span>

            <span>
            <i class="bi bi-chat-dots"></i>
            <span th:text="${post.commentCount}">0</span> Comments
        </span>

            <span>
            <i class="bi bi-arrow-repeat"></i>
            <span th:text="${post.shareCount}">0</span> Shares
        </span>
        </div>

        <div class="d-flex justify-content-around">

            <!-- LIKE -->
            <form th:action="@{/posts/{id}/like(id=${post.postId})}"
                  method="post">
                <button type="submit"
                        class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-hand-thumbs-up"></i> Like
                </button>
            </form>

            <!-- COMMENT -->
            <form th:action="@{/posts/{id}/comments(id=${post.postId})}"
                  method="post"
                  class="d-flex gap-2">

                <input type="text"
                       name="commentText"
                       class="form-control form-control-sm"
                       placeholder="Write comment..."
                       required>

                <button type="submit"
                        class="btn btn-sm btn-outline-secondary">
                    Comment
                </button>
            </form>

            <!-- SHARE -->
            <form th:action="@{/posts/{id}/share(id=${post.postId})}"
                  method="post">
                <button type="submit"
                        class="btn btn-sm btn-outline-success">
                    <i class="bi bi-arrow-repeat"></i> Share
                </button>
            </form>

        </div>

    </div>

</div>

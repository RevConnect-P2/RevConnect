<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Saved Posts | RevConnect</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <link rel="stylesheet" th:href="@{/css/my-posts.css}">
</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{layout/navbar :: navbar(${user})}"></div>

<div class="container mt-4">
    <div class="row">

        <!-- LEFT SIDEBAR -->
        <div class="col-md-3 sidebar-sticky">
            <div th:replace="layout/left-sidebar :: leftSidebar(${user},${connectionsCount},${followersCount},${followingCount})"></div>
        </div>

        <!-- CENTER CONTENT -->
        <div class="col-md-6">

            <h5 class="mb-3 fw-bold">Saved Posts</h5>

            <!-- SAVED POSTS CONTAINER -->
            <div id="savedPostsContainer"></div>

        </div>

        <!-- RIGHT SIDEBAR -->
        <div class="col-md-3 sidebar-sticky">
            <div th:replace="layout/right-sidebar :: rightSidebar"></div>
        </div>

    </div>
</div>

<script th:inline="javascript">
    window.CURRENT_USER_ID = [[${user.userId}]];
</script>

<script src="/js/posts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", fetchSavedPostsPage);
</script>

<div id="centerMessage"></div>

<div class="modal fade" id="deleteCommentModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Delete Comment</h5>
            </div>

            <div class="modal-body">
                Are you sure you want to delete this comment?
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancel
                </button>

                <button class="btn btn-danger" id="confirmDeleteComment">
                    Delete
                </button>
            </div>

        </div>
    </div>
</div>



</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="postFeed" class="mt-4">

    <!-- CREATE POST -->
    <div class="card feed-card mb-3">

        <div class="card-body">

            <h6 class="fw-bold mb-3">
                Create Post
            </h6>

            <textarea
                    id="postContent"
                    class="form-control mb-3"
                    rows="3"
                    placeholder="What's on your mind?">
            </textarea>

            <!-- POST OPTIONS -->
            <div class="row g-2 mb-3">

                <div class="col-md-4">

                    <select id="postType"
                            class="form-select form-select-sm">

                        <option value="NORMAL">
                            Normal Post
                        </option>

                        <option value="PROMOTIONAL">
                            Promotional Post
                        </option>

                    </select>

                </div>

                <div class="col-md-4 d-flex align-items-center">

                    <input type="checkbox"
                           id="pinned"
                           class="form-check-input me-2">

                    <label for="pinned"
                           class="form-check-label small">
                        Pin to profile
                    </label>

                </div>

            </div>

            <!-- HASHTAGS -->
            <input type="text"
                   id="hashtags"
                   class="form-control form-control-sm mb-3"
                   placeholder="#java #springboot">

            <!-- CTA SECTION -->
            <div id="ctaSection"
                 class="row g-2 mb-3 d-none">

                <div class="col-md-6">

                    <input type="text"
                           id="ctaText"
                           class="form-control form-control-sm"
                           placeholder="CTA Text">

                </div>

                <div class="col-md-6">

                    <input type="text"
                           id="ctaLink"
                           class="form-control form-control-sm"
                           placeholder="CTA Link">

                </div>

            </div>

            <!-- SCHEDULE -->
            <div class="row g-2 mb-3">

                <div class="col-md-6">

                    <input type="datetime-local"
                           id="scheduledAt"
                           class="form-control form-control-sm">

                </div>

            </div>

            <!-- POST BUTTON -->
            <div class="text-end">

                <button type="button"
                        class="btn btn-primary btn-sm"
                        onclick="createPost()">

                    Post

                </button>

            </div>

        </div>

    </div>

    <!-- FILTER BAR -->
    <div class="card feed-card mb-3">

        <div class="card-body d-flex gap-2">

            <button class="btn btn-sm btn-primary feed-filter-btn"
                    onclick="setFeedFilter('ALL')">
                All
            </button>

            <button class="btn btn-sm btn-outline-primary feed-filter-btn"
                    onclick="setFeedFilter('NORMAL')">
                Normal
            </button>

            <button class="btn btn-sm btn-outline-primary feed-filter-btn"
                    onclick="setFeedFilter('PROMOTIONAL')">
                Promotional
            </button>

        </div>

    </div>

    <!-- POSTS CONTAINER -->
    <div id="feedContainer">

        <div class="text-center text-muted">

            <p class="small">
                No posts yet. Start sharing your thoughts ✨
            </p>

        </div>

    </div>

</div>

</html>

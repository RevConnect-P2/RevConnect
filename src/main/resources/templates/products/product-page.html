<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">

            <h4 th:text="${post.content}"></h4>

            <div class="mt-3">
                <span th:each="tag : ${post.tags}"
                      class="badge me-2"
                      th:classappend="${tag.tagType.name() == 'PRODUCT' ? 'bg-info' : 'bg-success'}"
                      th:text="${tag.tagType + ': ' + tag.tagName}">
                </span>
            </div>

            <hr>

            <p class="text-muted">
                This is a dummy product page.
            </p>

            <a href="/dashboard" class="btn btn-secondary btn-sm">
                Back to Feed
            </a>

        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>


    <title>Notifications</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- BOOTSTRAP ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- YOUR THEME -->
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">


</head>

<body>

<!-- NAVBAR -->

<div th:replace="~{layout/navbar :: navbar(${session.loggedUser})}"></div>

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <h4 class="fw-bold mb-4">Notifications</h4>


            <!-- FILTER + MARK ALL -->

            <div class="card feed-card mb-3">
                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>

                        <span class="text-muted">
                            Unread Notifications:
                        </span>

                            <strong th:text="${unreadCount}"></strong>

                        </div>

                        <form th:action="@{/notifications/read-all}" method="post">
                            <button type="submit"
                                    class="btn btn-success btn-sm">
                                Mark All Read
                            </button>
                        </form>

                    </div>

                    <hr>

                    <form th:action="@{/notifications/filter}"
                          method="get"
                          class="d-flex gap-2">

                        <select name="type"
                                class="form-select form-select-sm"
                                style="max-width:200px;">

                            <option value=""
                                    th:selected="${selectedType == null}">
                                All Notifications
                            </option>

                            <option value="LIKE"
                                    th:selected="${selectedType == T(com.revconnect.enums.NotificationType).LIKE}">
                                Likes
                            </option>

                            <option value="COMMENT"
                                    th:selected="${selectedType == T(com.revconnect.enums.NotificationType).COMMENT}">
                                Comments
                            </option>

                            <option value="FOLLOW"
                                    th:selected="${selectedType == T(com.revconnect.enums.NotificationType).FOLLOW}">
                                Follows
                            </option>

                            <option value="CONNECTION"
                                    th:selected="${selectedType == T(com.revconnect.enums.NotificationType).CONNECTION}">
                                Connections
                            </option>

                            <option value="SHARE"
                                    th:selected="${selectedType == T(com.revconnect.enums.NotificationType).SHARE}">
                                Shares
                            </option>

                            <option value="POST"
                                    th:selected="${selectedType == T(com.revconnect.enums.NotificationType).POST}">
                                Posts
                            </option>

                        </select>

                        <button type="submit"
                                class="btn btn-outline-primary btn-sm">
                            Filter
                        </button>

                    </form>

                </div>
            </div>


            <!-- NOTIFICATION LIST -->

            <div th:if="${#lists.isEmpty(notifications)}"
                 class="text-muted">
                No notifications found
            </div>


            <div th:each="n : ${notifications}"
                 class="card feed-card mb-3"
                 th:style="${!n.read} ? 'border-left:3px solid #ff4d4d' : ''">

                <div class="card-body">

                    <p class="mb-1"
                       th:text="${n.message}"></p>

                    <small class="post-time"
                           th:text="${#temporals.format(n.createdAt,'dd MMM yyyy HH:mm')}"></small>

                    <div class="mt-2">

                        <form th:if="${!n.read}"
                              th:action="@{'/notifications/read/' + ${n.id}}"
                              method="post"
                              style="display:inline;">

                            <input type="hidden"
                                   name="type"
                                   th:value="${selectedType}"/>

                            <button class="btn btn-outline-success btn-sm">
                                Mark Read
                            </button>

                        </form>


                        <form th:if="${n.read}"
                              th:action="@{'/notifications/unread/' + ${n.id}}"
                              method="post"
                              style="display:inline;">

                            <input type="hidden"
                                   name="type"
                                   th:value="${selectedType}"/>

                            <button class="btn btn-outline-secondary btn-sm">
                                Mark Unread
                            </button>

                        </form>


                        <form th:action="@{'/notifications/delete/' + ${n.id}}"
                              method="post"
                              style="display:inline;">

                            <button class="btn btn-outline-danger btn-sm">
                                Delete
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


</div>

</body>
</html>

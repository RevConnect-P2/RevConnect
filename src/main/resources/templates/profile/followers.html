<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Followers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h3>Followers</h3>
    <hr>

    <div th:each="follow : ${followersList}" class="card p-3 mb-2">

        <a th:href="@{/profile/{username}(username=${follow.follower.username})}"
           th:text="${follow.follower.username}"></a>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/edit-profile.css}">
</head>

<body>

<div th:replace="~{layout/navbar :: navbar(${session.loggedUser})}"></div>

<div class="container mt-5" style="max-width:700px;">

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h4 class="mb-4 text-center">Edit Profile</h4>

            <form th:action="@{/profile/update}" method="post">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text"
                           name="fullName"
                           class="form-control"
                           th:value="${profile.fullName}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Bio</label>
                    <textarea name="bio"
                              class="form-control"
                              rows="3"
                              th:text="${profile.bio}"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text"
                           name="location"
                           class="form-control"
                           th:value="${profile.location}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Website</label>
                    <input type="url"
                           name="website"
                           class="form-control"
                           th:value="${profile.website}">
                </div>

                <div th:if="${profile.profileType.name() == 'CREATOR'}">
                    <div class="mb-3">
                        <label class="form-label">Creator Category</label>
                        <input type="text"
                               name="category"
                               class="form-control"
                               th:value="${profile.category}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">External Links</label>
                        <textarea name="externalLinks"
                                  class="form-control"
                                  rows="2"
                                  th:text="${profile.externalLinks}"></textarea>
                    </div>
                </div>

                <div th:if="${profile.profileType.name() == 'BUSINESS'}">
                    <div class="mb-3">
                        <label class="form-label">Business Address</label>
                        <textarea name="businessAddress"
                                  class="form-control"
                                  rows="2"
                                  th:text="${profile.businessAddress}"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contact Info</label>
                        <input type="text"
                               name="contactInfo"
                               class="form-control"
                               th:value="${profile.contactInfo}">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Profile Visibility</label>
                    <select name="profileVisibility" class="form-select">
                        <option value="PUBLIC" th:selected="${profile.profileVisibility == 'PUBLIC'}">Public</option>
                        <option value="PRIVATE" th:selected="${profile.profileVisibility == 'PRIVATE'}">Private</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Profile Type</label>
                    <select class="form-select" disabled>
                        <option th:selected="${profile.profileType.name() == 'PERSONAL'}">PERSONAL</option>
                        <option th:selected="${profile.profileType.name() == 'CREATOR'}">CREATOR</option>
                        <option th:selected="${profile.profileType.name() == 'BUSINESS'}">BUSINESS</option>
                    </select>
                    <input type="hidden" name="profileType" th:value="${profile.profileType.name()}" />
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/profile" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>

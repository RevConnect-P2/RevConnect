<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Business Hours</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        function toggleHours(checkbox) {
            const row = checkbox.closest('.row');
            const openTime = row.querySelector('input[name="openTime"]');
            const closeTime = row.querySelector('input[name="closeTime"]');

            if (checkbox.checked) {
                openTime.value = "";
                closeTime.value = "";
                openTime.readOnly = true;
                closeTime.readOnly = true;
            } else {
                openTime.readOnly = false;
                closeTime.readOnly = false;
            }
        }
    </script>
</head>

<body style="background:#f3f2ef;">

<div class="container mt-5" style="max-width:800px;">
    <div class="card shadow-sm">
        <div class="card-body">

            <h4 class="mb-4 text-center">Business Hours</h4>

            <div th:if="${error}" class="alert alert-danger text-center">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/profile/business-hours}" method="post">

                <div th:each="day : ${days}" class="row align-items-center mb-3">

                    <div class="col-md-3">
                        <strong th:text="${day}"></strong>
                        <input type="hidden" name="dayOfWeek" th:value="${day}">
                    </div>

                    <div class="col-md-3">
                        <input
                                type="time"
                                class="form-control"
                                name="openTime">
                    </div>

                    <div class="col-md-3">
                        <input
                                type="time"
                                class="form-control"
                                name="closeTime">
                    </div>

                    <div class="col-md-3 text-center">
                        <input
                                type="checkbox"
                                name="isClosed"
                                th:value="${day}"
                                onchange="toggleHours(this)">
                        Closed
                    </div>

                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/profile" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Hours</button>
                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>

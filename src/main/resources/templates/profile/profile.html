<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <!-- Profile Header -->
    <div class="row align-items-center">

        <!-- Profile Picture -->
        <div class="col-md-3 text-center">
            <img
                    th:src="${profile.profilePic != null ? profile.profilePic : '/images/default-profile.png'}"
                    class="rounded-circle border"
                    width="150"
                    height="150"
                    alt="Profile Pic">
        </div>

        <!-- Profile Info -->
        <div class="col-md-9">

            <!-- Username -->
            <h3 class="mb-2" th:text="${profile.username}">
                username
            </h3>

            <!-- Stats (later via dashboard aggregation) -->
            <div class="d-flex gap-4 mb-3">
                <span><strong>0</strong> posts</span>
                <span><strong>0</strong> followers</span>
                <span><strong>0</strong> following</span>
            </div>

            <!-- Full Name -->
            <p class="mb-1">
                <strong th:text="${profile.fullName}">
                    Full Name
                </strong>
            </p>

            <!-- Bio -->
            <p class="mb-1" th:text="${profile.bio}">
                Bio
            </p>

            <!-- Profile Type -->
            <p class="text-muted">
                Profile Type:
                <span th:text="${profile.profileType}"></span>
            </p>

            <!-- Optional fields (safe even if null) -->
            <p th:if="${profile.location != null}">
                📍 <span th:text="${profile.location}"></span>
            </p>

            <p th:if="${profile.website != null}">
                🔗 <a th:href="${profile.website}" th:text="${profile.website}"></a>
            </p>

        </div>
    </div>

    <hr class="my-4"/>

    <!-- Posts Section -->
    <h5 class="mb-3 text-center">
        My Posts
    </h5>

    <!-- Posts Placeholder -->
    <div class="row text-center text-muted">
        <p>Posts will appear here later.</p>
    </div>

    <a href="/profile/edit" class="btn btn-outline-primary btn-sm">
        Edit Profile
    </a>

</div>

</body>
</html>

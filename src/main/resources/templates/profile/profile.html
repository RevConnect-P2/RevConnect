<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Profile | RevConnect</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">

</head>

<body>

<!-- NAVBAR -->
<div th:replace="layout/navbar :: navbar(${profile})"></div>

<div class="container profile-container mt-4">

    <!-- PROFILE HEADER -->

    <div class="card profile-card mb-4">

        <div class="profile-cover"></div>

        <div class="text-center">

            <img th:src="${profile.profilePic != null ? profile.profilePic : '/images/default-profile.png'}"
                 class="profile-img">

            <h3 th:text="${profile.username}"></h3>

            <p class="profile-type"
               th:text="${profile.profileType}"></p>

            <div class="row mt-3 mb-3">

                <div class="col">
                    <h5 th:text="${postCount}"></h5>
                    <small class="text-muted">Posts</small>
                </div>

                <div class="col">
                    <h5>0</h5>
                    <small class="text-muted">Followers</small>
                </div>

                <div class="col">
                    <h5>0</h5>
                    <small class="text-muted">Following</small>
                </div>

            </div>

        </div>

    </div>

    <!-- ABOUT -->

    <div class="card profile-card p-4 mb-3">

        <h5>About</h5>
        <hr>

        <p>
            <i class="fa fa-user info-icon"></i>
            <b>Name:</b>
            <span th:text="${profile.fullName}"></span>
        </p>

        <p>
            <i class="fa fa-location-dot info-icon"></i>
            <b>Location:</b>
            <span th:text="${profile.location}"></span>
        </p>

        <p>
            <i class="fa fa-id-badge info-icon"></i>
            <b>Profile Type:</b>
            <span th:text="${profile.profileType}"></span>
        </p>

        <p>
            <i class="fa fa-info-circle info-icon"></i>
            <b>Bio:</b>
            <span th:text="${profile.bio}"></span>
        </p>

    </div>

    <!-- EDIT PROFILE -->

    <div class="mb-4">

        <a href="/profile/edit"
           class="btn edit-profile-btn w-100">

            Edit Profile

        </a>

    </div>

    <!-- POSTS -->

    <div class="card profile-card p-4">

        <h5>Posts</h5>
        <hr>

        <div id="profilePostsContainer">
            <p class="text-center text-muted">Loading posts...</p>
        </div>

    </div>

</div>

<script th:inline="javascript">
    window.CURRENT_USER_ID = [[${profile.userId}]];
</script>

<script src="/js/posts.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", fetchProfilePosts);
</script>

<!-- DELETE COMMENT MODAL -->

<div class="modal fade" id="deleteCommentModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Delete Comment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                Are you sure you want to delete this comment?
            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancel
                </button>

                <button class="btn btn-danger" id="confirmDeleteComment">
                    Delete
                </button>

            </div>

        </div>

    </div>
</div>

<div id="centerMessage"></div>

</body>
</html>

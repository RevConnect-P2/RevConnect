<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Profile</title>

    <!-- ✅ Bootstrap Added -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body style="background-color:#f3f2ef;">

<div class="container mt-5">

    <!-- ================= TOP BUTTONS ================= -->
    <div class="d-flex justify-content-end mb-3">

        <!-- Home Button -->
        <a href="/dashboard" class="btn btn-primary me-2">
            🏠 Home
        </a>

        <!-- Edit Profile Button -->
        <a href="/profile/edit" class="btn btn-outline-primary me-2">
            Edit Profile
        </a>

        <!-- Business Hours Button -->
        <a th:if="${profile.profileType.name() == 'BUSINESS'}"
           href="/profile/business-hours"
           class="btn btn-outline-success">
            Business Hours
        </a>

    </div>


    <!-- ================= PROFILE CARD ================= -->
    <div class="card shadow-sm p-4">

        <div class="row align-items-center">

            <!-- Profile Picture -->
            <div class="col-md-3 text-center">

                <img th:src="${profile.profilePic != null ? profile.profilePic : '/images/default-profile.png'}"
                     class="rounded-circle border"
                     width="150"
                     height="150"
                     alt="Profile Pic">

            </div>


            <!-- Profile Info -->
            <div class="col-md-9">

                <!-- Username -->
                <h3 th:text="${profile.username}">username</h3>


                <!-- Stats -->
                <div class="d-flex gap-4 mb-2">

                    <span><strong>0</strong> posts</span>

                    <span><strong>0</strong> followers</span>

                    <span><strong>0</strong> following</span>

                </div>


                <!-- Full Name -->
                <p class="mb-1">

                    <strong th:text="${profile.fullName}">
                        Full Name
                    </strong>

                </p>


                <!-- Bio -->
                <p th:text="${profile.bio}"></p>


                <!-- Profile Type -->
                <p class="text-muted">

                    Profile Type:

                    <strong th:text="${profile.profileType}"></strong>

                </p>


                <!-- Location -->
                <p th:if="${profile.location}">

                    📍 <span th:text="${profile.location}"></span>

                </p>


                <!-- Website -->
                <p th:if="${profile.website}">

                    🔗

                    <a th:href="${profile.website}"
                       th:text="${profile.website}">
                    </a>

                </p>



                <!-- ================= CREATOR INFO ================= -->

                <div th:if="${profile.profileType.name() == 'CREATOR'}">

                    <p th:if="${profile.category}">

                        🎨 <strong>Category:</strong>

                        <span th:text="${profile.category}"></span>

                    </p>


                    <p th:if="${profile.externalLinks}">

                        🔗 <strong>Links:</strong>

                        <span th:text="${profile.externalLinks}"></span>

                    </p>

                </div>



                <!-- ================= BUSINESS INFO ================= -->

                <div th:if="${profile.profileType.name() == 'BUSINESS'}">


                    <p th:if="${profile.businessAddress}">

                        🏢 <strong>Business Address:</strong>

                        <span th:text="${profile.businessAddress}"></span>

                    </p>


                    <p th:if="${profile.contactInfo}">

                        📞 <strong>Contact Info:</strong>

                        <span th:text="${profile.contactInfo}"></span>

                    </p>



                    <!-- Business Hours -->

                    <div th:if="${businessHours != null and !businessHours.isEmpty()}">

                        <h5 class="mt-3">🕒 Business Hours</h5>

                        <hr>

                        <div th:each="hour : ${businessHours}"
                             class="d-flex justify-content-between">

                            <span th:text="${hour.dayOfWeek}"></span>


                            <span th:if="${hour.isClosed}">

                                Closed

                            </span>


                            <span th:if="${!hour.isClosed}">

                                <span th:text="${#temporals.format(hour.openTime,'hh:mm a')}"></span>

                                -

                                <span th:text="${#temporals.format(hour.closeTime,'hh:mm a')}"></span>

                            </span>

                        </div>

                    </div>

                </div>


            </div>

        </div>

    </div>



    <!-- ================= POSTS SECTION ================= -->

    <div class="card shadow-sm mt-4 p-4">

        <h5 class="text-center mb-3">My Posts</h5>

        <p class="text-center text-muted">

            Posts will appear here later.

        </p>

    </div>


</div>

</body>
</html>

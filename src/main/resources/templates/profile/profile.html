<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Profile</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">

</head>

<body>

<!-- NAVBAR -->


<div th:replace="~{layout/navbar :: navbar(${session.loggedUser})}"></div>

<div class="profile-container mt-4">

    <!-- PROFILE HEADER -->

    <div class="profile-card text-center mb-4">

        <div class="profile-cover"></div>

        <div class="d-flex justify-content-center">
            <div class="profile-avatar">

<span th:if="${profile.profilePic == null}"
      th:text="${#strings.substring(username,0,1).toUpperCase()}">U</span>

                <img th:if="${profile.profilePic != null}"
                     th:src="${profile.profilePic}"
                     class="img-fluid rounded-circle"
                     style="width:100%; height:100%; object-fit:cover;">

            </div>
        </div>

        <div class="pb-4">

            <div class="profile-name" th:text="${username}">Username</div>

            <div class="text-muted" th:text="${profile.profileType}"></div>

            <div class="row profile-stats text-center mt-4">

                <!-- POSTS -->
                <div class="col">
                    <h5 th:text="${postCount}">0</h5>
                    <small>Posts</small>
                </div>

                <!-- FOLLOWERS -->
                <div class="col">

                    <a th:href="@{/profile/{username}/followers(username=${username})}"
                       class="text-decoration-none text-light">

                        <h5 th:text="${followers}">0</h5>
                        <small>Followers</small>

                    </a>

                </div>

                <!-- FOLLOWING -->
                <div class="col">

                    <a th:href="@{/profile/{username}/following(username=${username})}"
                       class="text-decoration-none text-light">

                        <h5 th:text="${following}">0</h5>
                        <small>Following</small>

                    </a>

                </div>

            </div>

        </div>

    </div>

    <!-- ABOUT -->

    <div class="about-card p-4 mb-4">

        <h5>About</h5>
        <hr>

        <p>
            <i class="fa fa-user info-icon"></i>
            <b>Name:</b>
            <span th:text="${profile.fullName}"></span>
        </p>

        <p>
            <i class="fa fa-location-dot info-icon"></i>
            <b>Location:</b>
            <span th:text="${profile.location}"></span>
        </p>

        <p>
            <i class="fa fa-id-badge info-icon"></i>
            <b>Profile Type:</b>
            <span th:text="${profile.profileType}"></span>
        </p>

        <p>
            <i class="fa fa-info-circle info-icon"></i>
            <b>Bio:</b>
            <span th:text="${profile.bio}"></span>
        </p>

        <!-- ===================== -->
        <!-- BUSINESS SECTION -->
        <!-- ===================== -->

        <div th:if="${profile.profileType.name() == 'BUSINESS'}">

            <hr>
            <h6 class="text-danger">Business Details</h6>

            <p>
                <i class="fa fa-building info-icon"></i>
                <b>Business Address:</b>
                <span th:text="${profile.businessAddress}"></span>
            </p>

            <p>
                <i class="fa fa-phone info-icon"></i>
                <b>Contact Info:</b>
                <span th:text="${profile.contactInfo}"></span>
            </p>

            <p th:if="${profile.website != null}">
                <i class="fa fa-globe info-icon"></i>
                <b>Website:</b>
                <a th:href="${profile.website}"
                   th:text="${profile.website}"
                   target="_blank"></a>
            </p>

            <hr>
            <h6 class="text-danger">Business Hours</h6>

            <div th:if="${businessHours != null}">

                <table class="table table-dark table-sm">

                    <thead>
                    <tr>
                        <th>Day</th>
                        <th>Status</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="hour : ${businessHours}">

                        <td th:text="${hour.dayOfWeek}"></td>

                        <td>

<span th:if="${hour.isClosed}">
Closed
</span>

                            <span th:if="${!hour.isClosed}">
<span th:text="${hour.openTime}"></span>
-
<span th:text="${hour.closeTime}"></span>
</span>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <!-- ===================== -->
        <!-- CREATOR SECTION -->
        <!-- ===================== -->

        <div th:if="${profile.profileType.name() == 'CREATOR'}">

            <hr>
            <h6 class="text-danger">Creator Details</h6>

            <p>
                <i class="fa fa-tag info-icon"></i>
                <b>Category:</b>
                <span th:text="${profile.category}"></span>
            </p>

            <p th:if="${profile.externalLinks != null}">
                <i class="fa fa-link info-icon"></i>
                <b>External Links:</b>

                <a th:href="${profile.externalLinks}"
                   th:text="${profile.externalLinks}"
                   target="_blank"></a>

            </p>

        </div>

    </div>

    <!-- BUTTONS -->

    <div class="mb-4 d-grid gap-2">

        <a href="/profile/edit" class="btn btn-danger w-100">
            Edit Profile
        </a>

        <a th:if="${profile.profileType.name() == 'BUSINESS'}"
           href="/profile/business-hours"
           class="btn btn-outline-danger w-100">

            Manage Business Hours

        </a>

    </div>

    <!-- POSTS -->

    <div class="profile-posts p-4">

        <h5>Posts</h5>
        <hr>

        <div id="profilePostsContainer">
            <p class="text-center text-muted">Loading posts...</p>
        </div>

    </div>

</div>

<!-- CURRENT USER -->

<script th:inline="javascript">

    window.CURRENT_USER_ID = [[${session.loggedUser.userId}]];
    window.PROFILE_USER_ID = [[${profile.userId}]];

</script>

<script src="/js/posts.js"></script>

<script>

    document.addEventListener("DOMContentLoaded", function () {

    if(window.PROFILE_USER_ID){
    fetchProfilePosts();
    }

    });

</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>User Profile</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>

        body{
            background:#f3f2ef;
        }

        .profile-container{
            max-width:900px;
            margin:auto;
        }

        .cover{
            height:180px;
            background:linear-gradient(90deg,#0a66c2,#004182);
            border-radius:12px 12px 0 0;
        }

        .profile-img{
            width:140px;
            height:140px;
            border-radius:50%;
            border:5px solid white;
            margin-top:-70px;
            object-fit:cover;
        }

        .card{
            border-radius:12px;
        }

        .info-icon{
            width:20px;
            margin-right:8px;
            color:#0a66c2;
        }

        .action-btn{
            min-width:120px;
        }

        .section-title{
            font-weight:600;
            color:#0a66c2;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->
<div class="bg-white shadow-sm p-3">
    <div class="container d-flex justify-content-between">
        <a href="/dashboard" class="btn btn-primary">
            <i class="fa fa-home"></i> Home
        </a>
    </div>
</div>

<div class="container profile-container mt-4">

    <!-- PROFILE HEADER -->
    <div class="card shadow-sm mb-4">

        <div class="cover"></div>

        <div class="text-center pb-4">

            <img th:src="${profile != null && profile.profilePic != null ? profile.profilePic : '/images/default-profile.png'}"
                 class="profile-img">

            <h3 th:text="${profile.fullName}">Full Name</h3>

            <p class="text-muted">
                @<span th:text="${user.username}">username</span>
            </p>

            <p class="text-muted" th:text="${profile.profileType}">
                Profile Type
            </p>

            <!-- FOLLOWERS / FOLLOWING -->
            <div class="d-flex justify-content-center gap-4 mt-2">

                <!-- FOLLOWERS -->
                <a th:href="@{/profile/{username}/followers(username=${user.username})}"
                   class="text-decoration-none text-dark text-center">

                    <h6 id="followersCount" class="mb-0" th:text="${followers}">0</h6>                    <small class="text-muted">Followers</small>

                </a>

                <!-- FOLLOWING -->
                <a th:href="@{/profile/{username}/following(username=${user.username})}"
                   class="text-decoration-none text-dark text-center">

                    <h6 class="mb-0" th:text="${following}">0</h6>
                    <small class="text-muted">Following</small>

                </a>

            </div>

            <div class="mt-3">

                <!-- FOLLOW BUTTON -->
                <button id="followBtn"
                        class="btn action-btn"
                        th:classappend="${isFollowing} ? 'btn-danger' : 'btn-primary'"
                        onclick="followUser()">

                    <i class="fa fa-user-plus"></i>

                    <span id="followText"
                          th:text="${isFollowing} ? 'Unfollow' : 'Follow'">
                    </span>

                </button>


                <!-- CONNECT BUTTON -->
                <button id="connectBtn"
                        class="btn btn-outline-primary action-btn"
                        onclick="connectUser()">

                    <i class="fa fa-handshake"></i>
                    <span id="connectText">Connect</span>

                </button>

            </div>

        </div>
    </div>

    <!-- ABOUT -->
    <div class="card shadow-sm p-4 mb-3">

        <h5 class="section-title">About</h5>
        <hr>

        <p>
            <i class="fa fa-user info-icon"></i>
            <b>Name:</b>
            <span th:text="${profile.fullName}"></span>
        </p>

        <p th:if="${profile.bio != null}">
            <i class="fa fa-info-circle info-icon"></i>
            <b>Bio:</b>
            <span th:text="${profile.bio}"></span>
        </p>

        <p th:if="${profile.location != null}">
            <i class="fa fa-location-dot info-icon"></i>
            <b>Location:</b>
            <span th:text="${profile.location}"></span>
        </p>

        <p th:if="${profile.website != null}">
            <i class="fa fa-globe info-icon"></i>
            <b>Website:</b>
            <a th:href="${profile.website}"
               th:text="${profile.website}"
               target="_blank"></a>
        </p>

    </div>


    <!-- CREATOR DETAILS -->
    <div th:if="${profile.profileType.name() == 'CREATOR'}"
         class="card shadow-sm p-4 mb-3">

        <h5 class="section-title">Creator Details</h5>
        <hr>

        <p>
            <b>Category:</b>
            <span th:text="${profile.category}"></span>
        </p>

        <p th:if="${profile.externalLinks != null}">
            <b>External Links:</b>
            <a th:href="${profile.externalLinks}"
               th:text="${profile.externalLinks}"
               target="_blank"></a>
        </p>

    </div>


    <!-- BUSINESS DETAILS -->
    <div th:if="${profile.profileType.name() == 'BUSINESS'}"
         class="card shadow-sm p-4 mb-3">

        <h5 class="section-title">Business Details</h5>
        <hr>

        <p>
            <b>Business Address:</b>
            <span th:text="${profile.businessAddress}"></span>
        </p>

        <p>
            <b>Contact Info:</b>
            <span th:text="${profile.contactInfo}"></span>
        </p>

    </div>


    <!-- POSTS -->
    <div class="card shadow-sm p-4 mb-4">

        <h5 class="section-title">Posts</h5>
        <hr>

        <!-- PUBLIC PROFILE -->
        <div th:if="${profile.profileVisibility == 'PUBLIC'}">

            <div id="profilePostsContainer">
                <p class="text-center text-muted">
                    Loading posts...
                </p>
            </div>

        </div>

        <!-- PRIVATE PROFILE -->
        <div th:if="${profile.profileVisibility == 'PRIVATE'}"
             class="text-center p-4">

            <h6 class="text-muted">
                🔒 This account is private
            </h6>

            <p class="text-muted">
                Send a connection request to see posts.
            </p>

            <button class="btn btn-primary"
                    onclick="connectUser()">

                <i class="fa fa-handshake"></i>
                Send Connection Request

            </button>

        </div>

    </div>

</div>


<!-- IMPORTANT: PROFILE USER ID -->
<script th:inline="javascript">
    window.PROFILE_USER_ID = [[${user.userId}]];
</script>

<script src="/js/posts.js"></script>
<script th:inline="javascript">

    // ======================
    // LOGGED-IN USER ID
    // ======================
    window.CURRENT_USER_ID = [[${session.loggedUser.userId}]];
    window.PROFILE_USER_ID = [[${user.userId}]];


    // ======================
    // FOLLOW / UNFOLLOW USER
    // ======================
    function followUser(){

    fetch(`/follow/toggle/${CURRENT_USER_ID}/${PROFILE_USER_ID}`,{
    method:"POST"
    })
    .then(response => response.json())
    .then(isFollowing => {

    let btn = document.getElementById("followBtn");
    let text = document.getElementById("followText");
    let followersCount = document.getElementById("followersCount");

    let count = parseInt(followersCount.innerText);

    if(isFollowing){

    text.innerText = "Unfollow";
    btn.classList.remove("btn-primary");
    btn.classList.add("btn-danger");

    followersCount.innerText = count + 1;

    }else{

    text.innerText = "Follow";
    btn.classList.remove("btn-danger");
    btn.classList.add("btn-primary");

    followersCount.innerText = count - 1;

    }

    })
    .catch(error => {

    console.error("Follow error:", error);
    alert("Follow request failed");

    });

    }


    // ======================
    // SEND CONNECTION REQUEST
    // ======================
    function connectUser(){

    fetch(`/connections/request/${CURRENT_USER_ID}/${PROFILE_USER_ID}`,{
    method:"POST"
    })
    .then(response => response.text())
    .then(message => {

    let btn = document.getElementById("connectBtn");
    let text = document.getElementById("connectText");

    text.innerText = "Request Sent";

    btn.classList.remove("btn-outline-primary");
    btn.classList.add("btn-secondary");

    })
    .catch(error => {

    console.error("Connection error:", error);
    alert("Connection request failed");

    });

    }


    // ======================
    // ACCEPT CONNECTION
    // ======================
    function acceptConnection(connectionId){

    fetch(`/connections/accept/${connectionId}`,{
    method:"POST"
    })
    .then(()=>{

    alert("Connection accepted");
    location.reload();

    });

    }


    // ======================
    // REJECT CONNECTION
    // ======================
    function rejectConnection(connectionId){

    fetch(`/connections/reject/${connectionId}`,{
    method:"POST"
    })
    .then(()=>{

    alert("Connection rejected");

    });

    }

    // ======================
    // CHECK CONNECTION STATUS
    // ======================
    function checkConnectionStatus(){

    fetch(`/connections/status/${CURRENT_USER_ID}/${PROFILE_USER_ID}`)
    .then(response => response.text())
    .then(status => {

    let btn = document.getElementById("connectBtn");
    let text = document.getElementById("connectText");

    if(!btn || !text){
    return;
    }

    // REQUEST SENT
    if(status === "PENDING"){

    text.innerText = "Request Sent";

    btn.classList.remove("btn-outline-primary");
    btn.classList.add("btn-secondary");

    btn.disabled = true;

    }

    // ALREADY CONNECTED
    else if(status === "ACCEPTED"){

    text.innerText = "Connected";

    btn.classList.remove("btn-outline-primary");
    btn.classList.add("btn-success");

    btn.disabled = true;

    }

    // NOT CONNECTED
    else{

    text.innerText = "Connect";

    btn.classList.remove("btn-secondary","btn-success");
    btn.classList.add("btn-outline-primary");

    btn.disabled = false;

    }

    });

    }

    // ======================
    // PAGE LOAD EVENTS
    // ======================
    document.addEventListener("DOMContentLoaded", function(){

    if(window.PROFILE_USER_ID){

    fetchProfilePosts();
    checkConnectionStatus();

    }

    });

</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>User Profile</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/public-profile.css}">

</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{layout/navbar :: navbar(${session.loggedUser},'none')}"></div>

<div class="container profile-container mt-4">


    <!-- PROFILE HEADER -->
    <div class="profile-card mb-4">

        <div class="profile-cover"></div>

        <div class="text-center pb-4">

            <img th:src="${profile != null && profile.profilePic != null ? profile.profilePic : '/images/default-profile.png'}"
                 class="profile-img">

            <h3 th:text="${profile.fullName}"></h3>

            <p class="text-muted">
                @<span th:text="${user.username}"></span>
            </p>

            <p class="text-muted" th:text="${profile.profileType}"></p>


            <!-- FOLLOWERS / FOLLOWING -->
            <div class="d-flex justify-content-center gap-5 mt-3 profile-stats">

                <a th:href="@{/profile/{username}/followers(username=${user.username})}"
                   class="text-decoration-none text-white text-center">

                    <h6 id="followersCount" th:text="${followers}"></h6>
                    <small>Followers</small>

                </a>

                <a th:href="@{/profile/{username}/following(username=${user.username})}"
                   class="text-decoration-none text-white text-center">

                    <h6 th:text="${following}"></h6>
                    <small>Following</small>

                </a>

            </div>


            <!-- ACTION BUTTONS -->
            <div class="mt-3"
                 th:if="${session.loggedUser.userId != user.userId}">

                <button id="followBtn"
                        class="btn action-btn"
                        th:classappend="${isFollowing} ? 'btn-danger' : 'btn-primary'"
                        onclick="followUser()">

                    <i class="fa fa-user-plus"></i>

                    <span id="followText"
                          th:text="${isFollowing} ? 'Unfollow' : 'Follow'"></span>

                </button>

                <button th:if="${connectionStatus == null || connectionStatus.name() == 'REJECTED'}"
                        id="connectBtn"
                        class="btn btn-outline-primary action-btn"
                        onclick="connectUser()">

                    <i class="fa fa-handshake"></i>
                    <span id="connectText">Connect</span>

                </button>

                <button th:if="${connectionStatus?.name() == 'PENDING'}"
                        class="btn btn-secondary action-btn"
                        disabled>

                    <i class="fa fa-clock"></i>
                    Request Sent

                </button>

                <button th:if="${connectionStatus?.name() == 'ACCEPTED'}"
                        class="btn btn-success action-btn"
                        disabled>

                    <i class="fa fa-check"></i>
                    Connected

                </button>

            </div>

        </div>

    </div>


    <!-- ABOUT -->
    <div class="profile-card p-4 mb-3">

        <h5 class="section-title">About</h5>

        <p>
            <i class="fa fa-user info-icon"></i>
            <b>Name:</b>
            <span th:text="${profile.fullName}"></span>
        </p>

        <p th:if="${profile.bio != null}">
            <i class="fa fa-info-circle info-icon"></i>
            <b>Bio:</b>
            <span th:text="${profile.bio}"></span>
        </p>

        <p th:if="${profile.location != null}">
            <i class="fa fa-location-dot info-icon"></i>
            <b>Location:</b>
            <span th:text="${profile.location}"></span>
        </p>

        <p th:if="${profile.website != null}">
            <i class="fa fa-globe info-icon"></i>
            <b>Website:</b>
            <a th:href="${profile.website}" th:text="${profile.website}" target="_blank"></a>
        </p>

    </div>


    <!-- CREATOR DETAILS -->
    <div th:if="${profile.profileType.name() == 'CREATOR'}"
         class="profile-card p-4 mb-3">

        <h5 class="section-title">Creator Details</h5>

        <p>
            <b>Category:</b>
            <span th:text="${profile.category}"></span>
        </p>

        <p th:if="${profile.externalLinks != null}">
            <b>External Links:</b>
            <a th:href="${profile.externalLinks}"
               th:text="${profile.externalLinks}"
               target="_blank"></a>
        </p>

    </div>


    <!-- BUSINESS DETAILS -->
    <div th:if="${profile.profileType.name() == 'BUSINESS'}"
         class="profile-card p-4 mb-3">

        <h5 class="section-title">Business Details</h5>

        <p>
            <b>Business Address:</b>
            <span th:text="${profile.businessAddress}"></span>
        </p>

        <p>
            <b>Contact Info:</b>
            <span th:text="${profile.contactInfo}"></span>
        </p>

        <p th:if="${profile.website != null}">
            <b>Website:</b>
            <a th:href="${profile.website}"
               th:text="${profile.website}"
               target="_blank"></a>
        </p>

    </div>


    <!-- BUSINESS HOURS -->
    <div th:if="${profile.profileType.name() == 'BUSINESS'}"
         class="profile-card p-4 mb-3">

        <h5 class="section-title">Business Hours</h5>

        <table class="table table-dark table-sm"
               th:if="${businessHours != null}">

            <thead>
            <tr>
                <th>Day</th>
                <th>Status</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="hour : ${businessHours}">

                <td th:text="${hour.dayOfWeek}"></td>

                <td>

<span th:if="${hour.isClosed}">
Closed
</span>

                    <span th:if="${!hour.isClosed}">
<span th:text="${hour.openTime}"></span>
-
<span th:text="${hour.closeTime}"></span>
</span>

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <!-- POSTS -->
    <div class="profile-card p-4 mb-4">

        <h5 class="section-title">Posts</h5>

        <div th:if="${canViewPosts}">

            <div id="profilePostsContainer">
                <p class="text-center text-muted">
                    Loading posts...
                </p>
            </div>

        </div>

        <div th:if="${!canViewPosts}" class="private-box">

            <h6>🔒 This account is private</h6>

            <p>Send a connection request to see posts.</p>

        </div>

    </div>

</div>


<script th:inline="javascript">

    window.CURRENT_USER_ID = [[${session.loggedUser.userId}]];
    window.PROFILE_USER_ID = [[${user.userId}]];

</script>

<script src="/js/posts.js"></script>

<script>

    document.addEventListener("DOMContentLoaded", function(){

    if(window.PROFILE_USER_ID){
    fetchProfilePosts();
    }

    checkConnectionStatus();

    });


    function followUser(){

    fetch(`/follow/toggle/${CURRENT_USER_ID}/${PROFILE_USER_ID}`,{
    method:"POST"
    })
    .then(response => response.json())
    .then(isFollowing => {

    let btn = document.getElementById("followBtn");
    let text = document.getElementById("followText");
    let followersCount = document.getElementById("followersCount");

    let count = parseInt(followersCount.innerText);

    if(isFollowing){

    text.innerText = "Unfollow";
    btn.classList.remove("btn-primary");
    btn.classList.add("btn-danger");

    followersCount.innerText = count + 1;

    }else{

    text.innerText = "Follow";
    btn.classList.remove("btn-danger");
    btn.classList.add("btn-primary");

    followersCount.innerText = count - 1;

    }

    });

    }


    function connectUser(){

    let btn = document.getElementById("connectBtn");
    let text = document.getElementById("connectText");

    btn.disabled = true;

    fetch(`/connections/request/${CURRENT_USER_ID}/${PROFILE_USER_ID}`,{
    method:"POST"
    })
    .then(response => response.text())
    .then(() => {

    text.innerText = "Request Sent";

    btn.classList.remove("btn-outline-primary");
    btn.classList.add("btn-secondary");

    });

    }


    function checkConnectionStatus(){

    fetch(`/connections/status/${CURRENT_USER_ID}/${PROFILE_USER_ID}`)
    .then(response => response.text())
    .then(status => {

    let btn = document.getElementById("connectBtn");
    let text = document.getElementById("connectText");

    if(!btn) return;

    if(status === "PENDING"){

    text.innerText = "Request Sent";
    btn.classList.remove("btn-outline-primary");
    btn.classList.add("btn-secondary");
    btn.disabled = true;

    }

    else if(status === "ACCEPTED"){

    text.innerText = "Connected";
    btn.classList.remove("btn-outline-primary");
    btn.classList.add("btn-success");
    btn.disabled = true;

    }

    });

    }

</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Following</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

<div th:replace="~{layout/navbar :: navbar(${session.loggedUser}, 'none')}"></div>

<div class="container mt-5 pt-4" style="max-width: 600px;">

    <h4 class="mb-4 text-white">Following</h4>
    <hr style="border-color: #1f1f1f;">

    <div th:if="${#lists.isEmpty(followingList)}" class="text-muted mt-3">
        You are not following anyone yet.
    </div>

    <div th:each="follow : ${followingList}" class="feed-card p-3 mb-2 d-flex align-items-center">

        <div class="search-avatar me-3"
             th:text="${#strings.substring(follow.following.username, 0, 1).toUpperCase()}">
        </div>

        <a th:href="@{/profile/{username}(username=${follow.following.username})}"
           class="text-decoration-none fw-bold text-white">
            <span th:text="${follow.following.username}"></span>
        </a>

    </div>

</div>

</body>
</html>

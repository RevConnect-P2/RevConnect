<div th:fragment="rightSidebar">

    <div class="card sidebar-card mb-3">

        <div class="card-body">

            <!-- TITLE -->
            <h6 class="sidebar-title">
                <i class="bi bi-hash me-2"></i>
                Trending Hashtags
            </h6>

            <!-- HASHTAG LIST -->
            <div th:if="${trendingTags != null}">

                <div class="news-item"
                     th:each="tag : ${trendingTags}">

                    <a href="javascript:void(0)"
                       class="text-decoration-none hashtag-link"
                       th:attr="data-tag=${tag}">

                        <div class="news-text text-primary">
                            #<span th:text="${tag}"></span>
                        </div>

                    </a>

                </div>

            </div>

            <!-- EMPTY STATE -->
            <div th:if="${trendingTags == null || #lists.isEmpty(trendingTags)}"
                 class="text-muted small">

                No trending hashtags yet

            </div>

        </div>

    </div>

</div>

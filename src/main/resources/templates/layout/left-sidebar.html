<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="leftSidebar(user, connectionsCount, followersCount, followingCount)">

    <!-- PROFILE CARD -->

    <div class="card sidebar-card mb-3">

        <!-- COVER -->
        <div class="sidebar-cover"></div>

        <!-- PROFILE IMAGE -->
        <div class="text-center">

            <img src="https://i.pravatar.cc/100?img=12"
                 class="profile-img">

        </div>

        <!-- USER INFO -->

        <div class="card-body text-center">

            <h6 class="fw-bold mb-0"
                th:text="${user.username}">
            </h6>

            <p class="sidebar-email"
               th:text="${user.email}">
            </p>

            <hr>

            <!-- STATS -->

            <div class="row text-center small sidebar-stats">

                <div class="col">

                    <div class="fw-bold"
                         th:text="${connectionsCount}">
                    </div>

                    <div class="stat-label">
                        Connections
                    </div>

                </div>

                <div class="col">

                    <div class="fw-bold"
                         th:text="${followersCount}">
                    </div>

                    <div class="stat-label">
                        Followers
                    </div>

                </div>

                <div class="col">

                    <div class="fw-bold"
                         th:text="${followingCount}">
                    </div>

                    <div class="stat-label">
                        Following
                    </div>

                </div>

            </div>

            <hr>

            <a href="/profile" class="btn profile-btn w-100">

                View Profile

            </a>

        </div>

    </div>

    <!-- QUICK LINKS -->

    <div class="card sidebar-card">

        <div class="card-body">

            <h6 class="fw-bold mb-3">

                Quick Links

            </h6>

            <a href="/posts" class="sidebar-link">

                <i class="bi bi-file-post"></i>

                My Posts

            </a>

            <a href="/saved" class="sidebar-link">

                <i class="bi bi-bookmark"></i>

                Saved Posts

            </a>

            <a href="/network" class="sidebar-link">

                <i class="bi bi-people"></i>

                Connections

            </a>

            <a href="/profile" class="sidebar-link">

                <i class="bi bi-person"></i>

                Profile

            </a>

        </div>

    </div>

</div>

</body>
</html>

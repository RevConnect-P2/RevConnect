<div th:fragment="leftSidebar(user, connectionsCount, followersCount, followingCount)"
     xmlns:th="http://www.w3.org/1999/xhtml">

    <div class="card profile-card mb-3">

        <div class="profile-cover"></div>

        <div class="sidebar-avatar-wrapper">
            <!-- SHOW USER PROFILE IMAGE -->
            <img th:if="${userProfile != null and userProfile.profilePic != null}"
                 th:src="@{${userProfile.profilePic}}"
                 class="profile-avatar shadow">

            <!-- SHOW DEFAULT LETTER IF NO IMAGE -->
            <div th:if="${userProfile == null or userProfile.profilePic == null}"
                 class="profile-avatar shadow d-flex align-items-center justify-content-center bg-secondary text-white">

                <span th:text="${#strings.substring(user.username,0,1).toUpperCase()}"></span>

            </div>

        </div>

        <div class="card-body text-center">

            <h6 class="fw-bold mb-0"
                th:text="${user.username}">
            </h6>

            <p class="text-muted small mb-2"
               th:text="${user.email}">
            </p>

            <hr class="mb-2">

            <div class="row text-center small">

                <!-- CONNECTIONS -->
                <div class="col">
                    <a href="/network" class="text-decoration-none text-dark">
                        <div class="fw-bold"
                             th:text="${connectionsCount}">
                        </div>
                        <div class="text-muted">
                            Connections
                        </div>
                    </a>
                </div>

                <!-- FOLLOWERS -->
                <div class="col">
                    <a th:href="@{/profile/{username}/followers(username=${user.username})}"
                       class="text-decoration-none text-dark">
                        <div class="fw-bold"
                             th:text="${followersCount}">
                        </div>
                        <div class="text-muted">
                            Followers
                        </div>
                    </a>
                </div>

                <!-- FOLLOWING -->
                <div class="col">
                    <a th:href="@{/profile/{username}/following(username=${user.username})}"
                       class="text-decoration-none text-dark">
                        <div class="fw-bold"
                             th:text="${followingCount}">
                        </div>
                        <div class="text-muted">
                            Following
                        </div>
                    </a>
                </div>

            </div>

            <hr>

            <a href="/profile"
               class="btn btn-primary btn-sm w-100 rounded-pill">
                View Profile
            </a>

        </div>

    </div>

    <div class="card profile-card">

        <div class="card-body">

            <h6 class="fw-bold mb-3">
                Quick Links
            </h6>

            <a href="/posts" class="sidebar-link">
                <i class="bi bi-file-post me-2"></i>
                My Posts
            </a>

            <a href="/saved" class="sidebar-link">
                <i class="bi bi-bookmark me-2"></i>
                Saved Posts
            </a>

            <a href="/network" class="sidebar-link">
                <i class="bi bi-people me-2"></i>
                Connections
            </a>

            <a href="/profile" class="sidebar-link">
                <i class="bi bi-person me-2"></i>
                Profile
            </a>

        </div>

    </div>

</div>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navbar(user)"
     class="navbar navbar-expand-lg rev-navbar sticky-top">

    <div class="container align-items-center">

        <!-- LOGO -->
        <a href="/dashboard"
           class="navbar-brand rev-logo me-4">
            RevConnect
        </a>

        <!-- SEARCH -->
        <div class="rev-search mx-auto position-relative">

            <input
                    id="userSearch"
                    class="form-control search-input w-100"
                    type="search"
                    placeholder="Search RevConnect">

            <div id="searchResults" class="search-results"></div>

        </div>

        <!-- RIGHT MENU -->
        <ul class="navbar-nav ms-auto align-items-center flex-row gap-4">

            <!-- HOME -->
            <li class="nav-item text-center">
                <a href="/dashboard" class="nav-link text-decoration-none">
                    <i class="bi bi-house nav-icon"></i>
                    <div class="nav-label text-light">Home</div>
                </a>
            </li>

            <!-- NETWORK -->
            <li class="nav-item text-center">
                <a href="/network" class="nav-link text-decoration-none">
                    <i class="bi bi-people nav-icon"></i>
                    <div class="nav-label text-light">Network</div>
                </a>
            </li>

            <!-- NOTIFICATIONS -->
            <li class="nav-item text-center position-relative">
                <a href="/notifications" class="nav-link text-decoration-none pt-2">
                    <i class="bi bi-bell nav-icon"></i>
                    <span class="badge notification-badge rounded-pill">
                        3
                    </span>
                    <div class="nav-label text-light">Notifications</div>
                </a>
            </li>

            <!-- PROFILE (Removed since it's not in screenshot navbar, only Logout is there, but keeping it if user wants, wait, the screenshot has Home, Network, Notifications, Logout. I should remove Profile from here or adjust icon depending on screenshot) -->
            <!-- LOGOUT -->
            <li class="nav-item ms-3">
                <a href="/logout" class="btn logout-btn">
                    Logout
                </a>
            </li>

        </ul>

    </div>

</nav>

</body>
</html>

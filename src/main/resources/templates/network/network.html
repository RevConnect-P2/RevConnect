<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Network - RevConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f3f2ef;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        /* Navbar */
        .navbar {
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            padding: 0.5rem 1rem;
        }

        .navbar-brand {
            font-size: 22px;
            font-weight: 700;
            color: #0d6efd !important;
        }

        .form-control {
            border-radius: 50px;
            padding-left: 15px;
        }

        .nav-link {
            font-size: 0.9rem;
            color: #333 !important;
        }

        .nav-link:hover {
            color: #0d6efd !important;
        }

        .badge {
            font-size: 0.7rem;
        }

        /* Sidebar */
        .sidebar-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        /* Main network card */
        .network-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            padding: 25px;
        }

        /* Section titles */
        .network-card h4,
        .network-card h6 {
            font-weight: 600;
        }

        /* Items inside lists */
        .network-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            background-color: #f9f9f9;
            transition: all 0.2s;
        }

        .network-item:hover {
            background-color: #e6f0ff;
        }

        .network-item span {
            font-weight: 500;
            font-size: 0.95rem;
            flex: 1;
        }

        .network-item div {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .network-item div + div {
            margin-left: 30px;
        }

        .network-item form {
            margin: 0;
        }

        /* Buttons styling */
        .network-item button {
            font-size: 0.8rem;
            padding: 3px 8px;
            white-space: nowrap;
}
        }

        .btn-success {
            background-color: #198754;
            border-color: #198754;
        }

        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }

        .btn-outline-danger {
            color: #dc3545;
            border-color: #dc3545;
        }

        .btn-outline-danger:hover {
            background-color: #dc3545;
            color: #fff;
        }

        .btn-outline-secondary {
            color: #6c757d;
            border-color: #6c757d;
        }

        .btn-outline-secondary:hover {
            background-color: #6c757d;
            color: #fff;
        }

        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }

        hr {
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .form-control {
                width: 100% !important;
                margin-bottom: 10px;
            }

            .navbar-nav {
                flex-direction: row !important;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">

        <!-- LOGO -->
        <a href="/dashboard" class="navbar-brand">RevConnect</a>

        <!-- SEARCH -->
        <form class="d-flex w-50 mx-3">
            <input class="form-control rounded-pill" type="search" placeholder="Search RevConnect">
        </form>

        <!-- MENU -->
        <ul class="navbar-nav ms-auto align-items-center">

            <!-- HOME -->
            <li class="nav-item text-center mx-2">
                <a href="/dashboard" class="nav-link text-dark">
                    <i class="bi bi-house fs-5"></i>
                    <div style="font-size:12px;">Home</div>
                </a>
            </li>

            <!-- NETWORK -->
            <li class="nav-item text-center mx-2">
                <a href="/network" class="nav-link text-dark">
                    <i class="bi bi-people fs-5"></i>
                    <div style="font-size:12px;">Network</div>
                </a>
            </li>

            <!-- PROFILE -->
            <li class="nav-item text-center mx-2">
                <a href="/profile" class="nav-link text-dark" th:text="${user.username}">Username
                    <i class="bi bi-person-circle fs-5"></i>
                </a>
            </li>

            <!-- LOGOUT -->
            <li class="nav-item mx-2">
                <a href="/logout" class="btn btn-danger btn-sm rounded-pill">Logout</a>
            </li>

        </ul>
    </div>
</nav>

<!-- NETWORK PAGE CONTENT -->
<div class="container mt-4">
    <div class="row">

        <!-- LEFT SIDEBAR -->
        <div class="col-md-3">
            <div class="sidebar-card">
                <!-- You can include left sidebar if needed -->
                <p><strong>Welcome,</strong> <span th:text="${user.username}"></span></p>
            </div>
        </div>

        <!-- MAIN NETWORK SECTION -->
        <div class="col-md-9">
            <div class="network-card">
                <h4 class="mb-4">My Network</h4>

                <!-- PENDING REQUESTS -->
                <h6>Pending Requests</h6>
                <div th:each="req : ${pendingRequests}" class="network-item">
                    <span th:text="${req.sender.username}">SenderName</span>
                    <form th:action="@{/network/accept/{id}(id=${req.connectionId})}" method="post" style="display:inline;">
                        <button class="btn btn-success btn-sm ms-2">Accept</button>
                    </form>
                    <form th:action="@{/network/reject/{id}(id=${req.connectionId})}" method="post" style="display:inline;">
                        <button class="btn btn-danger btn-sm ms-1">Reject</button>
                    </form>
                </div>
                <hr>

                <!-- CONNECTIONS -->
                <h6>Your Connections</h6>
                <div th:each="c : ${connections}" class="network-item">
                    <span th:text="${c.sender.userId == user.userId ? c.receiver.username : c.sender.username}">ConnectionName</span>
                    <form th:action="@{/network/remove/{id}(id=${c.connectionId})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-outline-danger btn-sm ms-2">Remove</button>
                    </form>
                </div>
                <hr>

                <!-- FOLLOWERS -->
                <h6>Followers</h6>
                <div th:each="f : ${followers}" class="network-item">
                    <span th:text="${f.username}">FollowerName</span>
                </div>
                <hr>

                <!-- FOLLOWING -->
                <h6>Following</h6>
                <div th:each="f : ${following}" class="network-item">
                    <span th:text="${f.username}">FollowingName</span>
                    <form th:action="@{/network/follow/unfollow/{id}(id=${f.userId})}" method="post" style="display:inline;">
                        <button class="btn btn-outline-secondary btn-sm ms-2">Unfollow</button>
                    </form>
                </div>
                <hr>

                <!-- AVAILABLE USERS TO CONNECT -->
                <h6>People You May Know</h6>
                <div th:each="u : ${availableUsers}" class="network-item">

                    <span th:text="${u.username}">Username</span>

                    <!-- CONNECT BUTTON -->
                    <div th:switch="${connectionStatusMap[u.userId]}">

                        <form th:case="'Connect'" th:action="@{/network/request/{id}(id=${u.userId})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-primary btn-sm ms-2">Connect</button>
                        </form>

                        <button th:case="'Requested'" class="btn btn-secondary btn-sm ms-2" disabled>
                            Requested
                        </button>

                        <button th:case="'Connected'" class="btn btn-success btn-sm ms-2" disabled>
                            Connected
                        </button>

                    </div>

                    <!-- FOLLOW BUTTON -->
                    <div th:if="${u.userType == 'CREATOR' or u.userType == 'BUSINESS'}">

                        <form th:if="${!followStatusMap[u.userId]}"
                              th:action="@{/network/follow/follow/{id}(id=${u.userId})}"
                              method="post" style="display:inline;">
                            <button type="submit" class="btn btn-success btn-sm ms-2">Follow</button>
                        </form>

                        <form th:if="${followStatusMap[u.userId]}"
                              th:action="@{/network/follow/unfollow/{id}(id=${u.userId})}"
                              method="post" style="display:inline;">
                            <button type="submit" class="btn btn-outline-secondary btn-sm ms-2">
                                Following
                            </button>
                        </form>

                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>

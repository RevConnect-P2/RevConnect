<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>RevConnect Feed</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">


    <!--    <div th:replace="layout/navbar :: navbar(${user})"></div>-->

</head>

<body>

    <!-- NAVBAR -->
    <div th:replace="~{layout/navbar :: navbar(${user})}"></div>

    <div class="container mt-4">
        <div class="row">

            <!-- LEFT SIDEBAR -->
            <div class="col-md-3 sidebar-sticky">
                <div
                    th:replace="layout/left-sidebar :: leftSidebar(${user},${connectionsCount},${followersCount},${followingCount})">
                </div>
            </div>

            <!-- CENTER FEED -->
            <div class="col-md-6">

                <!-- CREATE POST -->
                <div class="card feed-card">

                    <div class="card-body">

                        <a href="/posts/create" class="text-decoration-none">

                            <div class="post-input">
                                Start a post
                            </div>

                        </a>

                        <div class="row text-center mt-3">

                            <div class="col post-action">
                                <i class="bi bi-image text-primary"></i><br>
                                Photo
                            </div>

                            <div class="col post-action">
                                <i class="bi bi-play-btn text-success"></i><br>
                                Video
                            </div>

                            <div class="col post-action">
                                <i class="bi bi-file-text text-danger"></i><br>
                                Article
                            </div>

                        </div>

                    </div>
                </div>

                <!-- FEED FILTER -->
                <div class="card feed-card">

                    <div class="card-body d-flex gap-2">

                        <button class="btn btn-sm feed-filter-btn active" data-filter="ALL"
                            onclick="setFeedFilter('ALL')">
                            All
                        </button>

                        <button class="btn btn-sm feed-filter-btn" data-filter="NORMAL"
                            onclick="setFeedFilter('NORMAL')">
                            Normal
                        </button>

                        <button class="btn btn-sm feed-filter-btn" data-filter="PROMOTIONAL"
                            onclick="setFeedFilter('PROMOTIONAL')">
                            Promotional
                        </button>

                    </div>

                </div>

                <!-- POSTS -->
                <div id="feedContainer"></div>

            </div>

            <!-- RIGHT SIDEBAR -->
            <div class="col-md-3 sidebar-sticky">
                <div th:replace="layout/right-sidebar :: rightSidebar"></div>
            </div>

        </div>
    </div>

    <!-- DELETE COMMENT MODAL -->

    <div class="modal fade" id="deleteCommentModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Delete Comment</h5>
                </div>

                <div class="modal-body text-center">
                    <p>Do you want to delete this comment?</p>
                </div>

                <div class="modal-footer justify-content-center">

                    <button class="btn btn-secondary" data-bs-dismiss="modal">
                        No
                    </button>

                    <button class="btn btn-danger" id="confirmDeleteComment">
                        Yes Delete
                    </button>

                </div>

            </div>

        </div>
    </div>

    <!-- CENTER MESSAGE -->

    <div id="centerMessage"></div>

    <script th:inline="javascript">
        window.CURRENT_USER_ID = [[${ user.userId }]];
        window.CURRENT_USER_NAME = [[${ user.username }]];
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/posts.js"></script>
    <script src="/js/search.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", fetchFeedPosts);
    </script>

</body>

</html>

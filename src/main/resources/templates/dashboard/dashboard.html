<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>RevConnect Feed</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">

</head>

<body>

<div th:replace="~{layout/navbar :: navbar(${user})}"></div>

<div class="container mt-4">
    <div class="row">

        <div class="col-md-3">
            <div th:replace="layout/left-sidebar :: leftSidebar(${user},${connectionsCount},${followersCount},${followingCount})"></div>
        </div>

        <div class="col-md-6">

            <div class="card feed-card">
                <div class="card-body">

                    <a href="/posts/create" class="text-decoration-none">
                        <div class="post-input">
                            Start a post
                        </div>
                    </a>

                    <div class="row text-center mt-3">
                        <div class="col post-action">
                            <i class="bi bi-image text-primary"></i><br>
                            Photo
                        </div>

                        <div class="col post-action">
                            <i class="bi bi-play-btn text-success"></i><br>
                            Video
                        </div>

                        <div class="col post-action">
                            <i class="bi bi-file-text text-danger"></i><br>
                            Article
                        </div>
                    </div>

                </div>
            </div>

            <div class="card feed-card">
                <div class="card-body d-flex gap-2">

                    <button class="btn btn-sm btn-primary feed-filter-btn"
                            onclick="setFeedFilter('ALL')">
                        All
                    </button>

                    <button class="btn btn-sm btn-outline-primary feed-filter-btn"
                            onclick="setFeedFilter('NORMAL')">
                        Normal
                    </button>

                    <button class="btn btn-sm btn-outline-primary feed-filter-btn"
                            onclick="setFeedFilter('PROMOTIONAL')">
                        Promotional
                    </button>

                </div>
            </div>

            <div id="feedContainer"></div>

        </div>

        <div class="col-md-3">
            <div th:replace="layout/right-sidebar :: rightSidebar"></div>
        </div>

    </div>
</div>

<script th:inline="javascript">
    window.CURRENT_USER_ID = [[${user.userId}]];
</script>

<script src="/js/posts.js"></script>



</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>RevConnect Feed</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f3f2ef;
        }

        .feed-card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }

        .post-input {
            background: #eef3f8;
            border-radius: 30px;
            padding: 12px 16px;
            color: #666;
            transition: 0.3s;
        }

        .post-input:hover {
            background: #e2eaf1;
            cursor: pointer;
        }

        .post-action {
            padding: 10px 0;
            border-radius: 6px;
            transition: 0.2s;
        }

        .post-action:hover {
            background: #eef3f8;
            cursor: pointer;
        }

        .post-user {
            font-weight: 600;
        }

        .post-text {
            font-size: 14px;
            line-height: 1.6;
        }
    </style>

</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{layout/navbar :: navbar(${user})}"></div>

<div class="container mt-4">
    <div class="row">

        <!-- LEFT SIDEBAR -->
        <div class="col-md-3">
            <div th:replace="layout/left-sidebar :: leftSidebar(${user},${connectionsCount},${followersCount},${followingCount})"></div>
        </div>

        <!-- CENTER FEED -->
        <div class="col-md-6">

            <!-- CREATE POST -->
            <div class="card feed-card">
                <div class="card-body">

                    <a href="/posts/create" class="text-decoration-none">
                        <div class="post-input">
                            Start a post
                        </div>
                    </a>

                    <div class="row text-center mt-3">
                        <div class="col post-action">
                            <i class="bi bi-image text-primary"></i><br>
                            Photo
                        </div>
                        <div class="col post-action">
                            <i class="bi bi-play-btn text-success"></i><br>
                            Video
                        </div>
                        <div class="col post-action">
                            <i class="bi bi-file-text text-danger"></i><br>
                            Article
                        </div>
                    </div>

                </div>
            </div>

            <!-- FEED FILTER BAR -->
            <div class="card feed-card">
                <div class="card-body d-flex gap-2">
                    <button class="btn btn-sm btn-primary feed-filter-btn"
                            data-filter="ALL"
                            onclick="setFeedFilter('ALL')">
                        All
                    </button>

                    <button class="btn btn-sm btn-outline-primary feed-filter-btn"
                            data-filter="NORMAL"
                            onclick="setFeedFilter('NORMAL')">
                        Normal
                    </button>

                    <button class="btn btn-sm btn-outline-primary feed-filter-btn"
                            data-filter="PROMOTIONAL"
                            onclick="setFeedFilter('PROMOTIONAL')">
                        Promotional
                    </button>
                </div>
            </div>

            <!-- FEED POSTS (Rendered by JS) -->
            <div id="feedContainer"></div>

        </div>

        <!-- RIGHT SIDEBAR -->
        <div class="col-md-3">
            <div th:replace="layout/right-sidebar :: rightSidebar"></div>
        </div>

    </div>
</div>

<script th:inline="javascript">
    window.CURRENT_USER_ID = [[${user.userId}]];
</script>
<script src="/js/posts.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", fetchFeedPosts);
</script>

<script th:inline="javascript">
    window.CURRENT_USER_ID = [[${user.userId}]];
</script>

<script src="/js/posts.js"></script>
<script src="/js/search.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", fetchFeedPosts);
</script>

</body>
</html>

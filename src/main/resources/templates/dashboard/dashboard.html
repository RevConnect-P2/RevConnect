<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>RevConnect Feed</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">


    <style>

        body{
        background:#f3f2ef;
        }


        /* FEED CARD */

        .feed-card{

        border-radius:12px;

        border:none;

        box-shadow:0 2px 6px rgba(0,0,0,0.08);

        }


        /* POST INPUT */

        .post-input{

        background:#eef3f8;

        border-radius:30px;

        padding:12px;

        color:#666;

        transition:0.3s;

        }


        .post-input:hover{

        background:#e2eaf1;

        cursor:pointer;

        }


        /* POST ACTION */

        .post-action{

        padding:8px;

        border-radius:6px;

        transition:0.2s;

        }


        .post-action:hover{

        background:#eef3f8;

        cursor:pointer;

        }


        /* POST USER NAME */

        .post-user{

        font-weight:600;

        }


        /* POST TEXT */

        .post-text{

        font-size:14px;

        }

    </style>


</head>


<body>



<!-- NAVBAR -->

<div th:replace="~{layout/navbar :: navbar(${user})}"></div>



<div class="container mt-4">

    <div class="row">



        <!-- LEFT SIDEBAR -->

        <div class="col-md-3">

            <div th:replace="layout/left-sidebar :: leftSidebar(${user},${connectionsCount},${followersCount},${followingCount})"></div>

        </div>

        <div class="col-md-6">



            <!-- CREATE POST -->

            <div class="card feed-card mb-3">

                        <div class="post-input">

                            Start a post

                        </div>


                    </a>



                    <div class="row text-center mt-3">


                        <div class="col post-action">

                            <i class="bi bi-image text-primary"></i>

                            Photo

                        </div>


                        <div class="col post-action">

                            <i class="bi bi-play-btn text-success"></i>

                            Video

                        </div>


                        <div class="col post-action">

                            <i class="bi bi-file-text text-danger"></i>

                            Article

                        </div>


                    </div>


                </div>

            </div>

<!--                            Share-->

<!--                        </div>-->


<!--                    </div>-->


<!--                </div>-->

<!--            </div>-->



        </div>




        <!-- RIGHT SIDEBAR -->

        <div class="col-md-3">

            <div th:replace="layout/right-sidebar :: rightSidebar"></div>

        </div>



    </div>

</div>

<script th:inline="javascript">
    window.CURRENT_USER_ID = [[${user.userId}]];
</script>
<script src="/js/posts.js"></script>

</html>
